<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KalibraFit</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    /* Paleta "gym" — fuerte, energica, alto contraste: acero oscuro + rojo
       potencia + dorado logro. Pensada para verse bien en cualquier publico,
       no solo en publico "fitness hardcore". */
    --bg: #F2F1ED;
    --surface: #FFFFFF;
    --surface-2: #EAE7E0;
    --ink: #16161A;
    --ink-soft: #62605C;
    --line: #DEDAD1;
    --primary: #E0202F;
    --primary-ink: #FFFFFF;
    --primary-soft: #FBDBDD;
    --accent: #E8930C;
    --accent-soft: #FBE7C4;
    --fat: #B8860B;
    --warn: #B5121B;
    --warn-soft: #F6D6D6;
    --shadow: 0 1px 2px rgba(20,20,22,0.08), 0 8px 24px -12px rgba(20,20,22,0.25);
    --radius-lg: 20px;
    --radius-md: 13px;
    --radius-sm: 9px;
    --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --font-body: 'Work Sans', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #121212;
      --surface: #1C1C1E;
      --surface-2: #262628;
      --ink: #F5F1EA;
      --ink-soft: #A8A29B;
      --line: #35353A;
      --primary: #FF4757;
      --primary-ink: #FFFFFF;
      --primary-soft: #3A1418;
      --accent: #FFB627;
      --accent-soft: #3A2A0A;
      --fat: #D9A441;
      --warn: #FF6B57;
      --warn-soft: #3B1712;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 12px 28px -14px rgba(0,0,0,0.7);
    }
  }
  :root[data-theme="dark"]{
    --bg: #121212;
    --surface: #1C1C1E;
    --surface-2: #262628;
    --ink: #F5F1EA;
    --ink-soft: #A8A29B;
    --line: #35353A;
    --primary: #FF4757;
    --primary-ink: #FFFFFF;
    --primary-soft: #3A1418;
    --accent: #FFB627;
    --accent-soft: #3A2A0A;
    --fat: #D9A441;
    --warn: #FF6B57;
    --warn-soft: #3B1712;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 12px 28px -14px rgba(0,0,0,0.7);
  }

  *{box-sizing:border-box;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  h1,h2,h3,.num,.display{
    font-family: var(--font-display);
    font-weight: 600;
    letter-spacing: 0.2px;
    text-wrap: balance;
  }
  .mono{font-family: var(--font-mono); font-variant-numeric: tabular-nums;}
  .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  button{font-family: inherit; cursor:pointer;}
  input, select{font-family: inherit;}
  a{color: inherit;}

  /* topbar */
  #topbar{
    padding: 18px 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    position: sticky; top:0; z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid transparent;
  }
  #topbar.scrolled{ border-bottom-color: var(--line); }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand-mark{
    width:32px; height:32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    color: var(--primary-ink);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-weight:700; font-size:18px;
    box-shadow: 0 3px 10px -3px rgba(224,32,47,0.55);
  }
  .brand-name{ font-family: var(--font-display); font-weight:700; font-size:21px; letter-spacing:0.6px; text-transform:uppercase; }
  .top-greeting{ font-size:12px; color:var(--ink-soft); }

  #content{ flex:1; padding: 4px 20px 96px; }
  section[hidden]{ display:none !important; }

  /* bottom nav */
  #bottomnav{
    position: sticky; bottom:0; left:0; right:0;
    background: var(--surface);
    border-top: 1px solid var(--line);
    display:flex;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    z-index: 6;
  }
  #bottomnav[hidden]{
    /* el display:flex de arriba le gana al [hidden] por defecto del
       navegador — sin esto, el nav inferior nunca se ocultaba de verdad
       en onboarding/paywall aunque bottomNav.hidden quedara en true. */
    display:none !important;
  }
  .nav-btn{
    flex:1; background:none; border:none; display:flex; flex-direction:column;
    align-items:center; gap:3px; padding:8px 2px 6px; border-radius: var(--radius-sm);
    color: var(--ink-soft); font-size: 11px; font-weight:600;
  }
  .nav-btn svg{ width:22px; height:22px; }
  .nav-btn.active{ color: var(--primary); }
  .nav-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline: 2px solid var(--primary); outline-offset: 2px;
  }

  /* cards */
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 16px;
  }
  .card + .card{ margin-top: 12px; }
  .stack{ display:flex; flex-direction:column; gap:12px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  /* hero ring card */
  .hero-card{
    background: linear-gradient(165deg, var(--primary) 0%, #7A0F1A 100%);
    color: var(--primary-ink);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  :root[data-theme="dark"] .hero-card, :root:not([data-theme="light"]) .hero-card{
    background: linear-gradient(165deg, #E0202F 0%, #1C1C1E 100%);
  }
  .hero-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .hero-label{ font-family: var(--font-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; opacity:0.75; }
  .ring-wrap{ display:flex; align-items:center; gap:18px; margin-top:10px; }
  .ring-num{ font-family: var(--font-display); font-size:44px; line-height:1; font-weight:700; }
  .ring-sub{ font-size:13px; opacity:0.85; margin-top:2px; }
  .hero-macros{ display:flex; gap:14px; margin-top:16px; }
  .hmac{ flex:1; }
  .hmac-bar{ height:5px; border-radius:4px; background: rgba(255,255,255,0.22); overflow:hidden; margin-top:6px; }
  .hmac-fill{ height:100%; border-radius:4px; background: rgba(255,255,255,0.92); }
  .hmac-label{ font-size:11px; opacity:0.8; }
  .hmac-val{ font-family: var(--font-mono); font-size:12px; margin-top:2px; }

  .pill{
    display:inline-flex; align-items:center; gap:6px;
    padding: 5px 11px; border-radius:99px; font-size:12px; font-weight:600;
    background: var(--surface-2); color: var(--ink-soft);
  }
  .pill.ok{ background: var(--primary-soft); color: var(--primary); }
  .pill.warn{ background: var(--warn-soft); color: var(--warn); }
  .pill.accent{ background: var(--accent-soft); color: var(--accent); }

  .btn{
    border-radius: 99px; border: none; padding: 12px 20px;
    font-weight:800; font-size:14px; letter-spacing:0.3px; text-transform:uppercase;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{ background: var(--primary); color: var(--primary-ink); width:100%; box-shadow:0 4px 14px -6px rgba(224,32,47,0.5); }
  .btn-accent{ background: var(--accent); color:#fff; width:100%; }
  .btn-ghost{ background: var(--surface-2); color: var(--ink); }
  .btn-line{ background:none; border:1px solid var(--line); color: var(--ink); }
  .btn-sm{ padding:7px 14px; font-size:12.5px; }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }

  .food-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:10px; }
  .food-row:last-child{ border-bottom:none; }
  .food-name{ font-weight:600; font-size:14px; }
  .food-meta{ font-size:12px; color: var(--ink-soft); }
  .food-kcal{ font-family: var(--font-mono); font-weight:600; font-size:13px; white-space:nowrap; }
  .icon-btn{ background:none; border:none; color: var(--ink-soft); padding:4px; display:flex; }
  .icon-btn svg{ width:17px; height:17px; }

  .section-title{ display:flex; align-items:baseline; justify-content:space-between; margin: 22px 0 10px; }
  .section-title h2{ font-size: 21px; }
  .section-title .see{ font-size:12px; color:var(--primary); font-weight:700; background:none; border:none; }

  .meal-card{ padding:0; overflow:hidden; }
  .meal-head{ display:flex; justify-content:space-between; align-items:center; padding:13px 15px; background: var(--surface-2); }
  .meal-head-title{ font-weight:700; font-size:14.5px; }
  .meal-head-time{ display:flex; align-items:center; gap:4px; font-family: var(--font-mono); font-size:11.5px; color: var(--ink-soft); margin-top:3px; }
  .meal-head-time svg{ width:12px; height:12px; }
  .meal-kcal{ font-family: var(--font-mono); font-size:12.5px; color: var(--ink-soft); white-space:nowrap; }
  .meal-body{ padding: 4px 15px 12px; }
  .reminder-row{ display:flex; align-items:center; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .bell-btn{ width:34px; height:34px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .bell-btn svg{ width:16px; height:16px; }
  .bell-btn.on{ background:var(--primary-soft); border-color:var(--primary); color:var(--primary); }
  .time-input{ border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:14px; background:var(--surface); color:var(--ink); font-family:var(--font-mono); width:92px; }
  .reminder-label{ font-size:11.5px; color:var(--ink-soft); flex:1; line-height:1.4; }
  .reminder-banner{ display:flex; align-items:center; gap:12px; background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--radius-md); padding:13px 14px; margin-bottom:14px; }
  .reminder-banner svg{ width:20px; height:20px; color:var(--accent); flex-shrink:0; }
  .reminder-banner-text{ flex:1; font-size:13px; color:var(--ink); line-height:1.4; }
  .reminder-banner-close{ background:none; border:none; color:var(--ink-soft); flex-shrink:0; padding:4px; }
  .reminder-banner-close svg{ width:16px; height:16px; color:var(--ink-soft); }
  .reminder-banner.warn{ background:var(--warn-soft); border-color:var(--warn); }
  .reminder-banner.warn svg{ color:var(--warn); }

  .day-toggle{ display:flex; background: var(--surface-2); border-radius:99px; padding:3px; gap:3px; }
  .day-toggle button{ flex:1; border:none; background:none; padding:9px 8px; border-radius:99px; font-size:13px; font-weight:700; color:var(--ink-soft); }
  .day-toggle button.active{ background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }

  .wk-day{ padding:0; }
  .wk-day-head{ display:flex; justify-content:space-between; align-items:center; padding:13px 15px; cursor:pointer; }
  .wk-day-title{ font-weight:700; font-size:14.5px; }
  .wk-day-sub{ font-size:11.5px; color:var(--ink-soft); font-family: var(--font-mono); }
  .wk-ex-list{ padding: 2px 15px 14px; }
  .wk-ex{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:13.5px; }
  .wk-ex.tappable{ cursor:pointer; }
  .wk-ex.tappable:hover .wk-ex-name{ color: var(--primary); }
  .wk-ex-text{ display:flex; justify-content:space-between; align-items:center; flex:1; gap:10px; }
  .wk-ex-chevron{ width:16px; height:16px; flex-shrink:0; color: var(--ink-soft); opacity:0.7; }
  .muscle-chevron{ width:18px; height:18px; flex-shrink:0; color: var(--ink-soft); transition: transform 0.2s ease; }
  .muscle-chevron.open{ transform: rotate(180deg); color: var(--primary); }
  .wk-ex.tappable:hover .wk-ex-chevron{ color: var(--primary); opacity:1; }

  /* exercise form figure */
  .fig-svg{ display:block; }
  .fig-limb{ stroke: var(--ink-soft); stroke-width:7.5; stroke-linecap:round; fill:none; }
  .fig-torso{ stroke: var(--primary); stroke-width:11; stroke-linecap:round; fill:none; }
  .fig-head{ fill: var(--ink-soft); stroke:none; }
  .fig-joint-torso{ fill: var(--primary); stroke:none; }
  .fig-joint-limb{ fill: var(--ink-soft); stroke:none; }
  .fig-floor{ stroke: var(--line); stroke-width:2.5; stroke-linecap:round; }
  .fig-bar{ stroke: var(--line); stroke-width:3; stroke-linecap:round; }
  .fig-prop{ stroke: var(--accent); stroke-width:3.5; stroke-linecap:round; fill: var(--accent); }
  .fig-card{ display:flex; justify-content:center; padding:14px; background: var(--surface-2); border-radius: var(--radius-md); margin-bottom:14px; }
  .fig-card[hidden]{ display:none !important; }
  .wk-ex-name{ font-weight:500; }
  .wk-ex-scheme{ font-family: var(--font-mono); color: var(--ink-soft); font-size:12.5px; white-space:nowrap; }
  .check-circle{ width:24px; height:24px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--surface); }
  .check-circle.done{ background: var(--primary); border-color: var(--primary); }
  .check-circle svg{ width:13px; height:13px; stroke:var(--primary-ink); display:none; }
  .check-circle.done svg{ display:block; }

  .stat-tile{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-md); padding:14px; }
  .stat-tile .num{ font-size:26px; }
  .stat-tile .eyebrow{ margin-bottom:2px; }

  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-size:12.5px; font-weight:600; color: var(--ink-soft); }
  .field input, .field select, .field textarea{
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 12px;
    font-size:15px; background: var(--surface); color: var(--ink); width:100%;
  }
  .field textarea{ font-family: inherit; resize: vertical; min-height:92px; line-height:1.4; }
  .seg{ display:flex; gap:8px; flex-wrap:wrap; }
  .seg button{
    border:1px solid var(--line); background: var(--surface); color: var(--ink);
    padding:9px 14px; border-radius:99px; font-size:13.5px; font-weight:600;
  }
  .seg button.active{ border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }

  .ob-wrap{ padding-top: 8px; }
  .ob-dots{ display:flex; gap:6px; margin-bottom:20px; }
  .ob-dots span{ height:4px; flex:1; border-radius:4px; background: var(--line); }
  .ob-dots span.on{ background: var(--primary); }
  .ob-hero{ font-size:15px; color:var(--ink-soft); margin-bottom:22px; }

  .chart-wrap{ width:100%; }
  .chart-wrap svg text{ font-family: var(--font-mono); font-size:9px; fill: var(--ink-soft); }

  .membership-card{
    border-radius: var(--radius-lg); padding:22px; color:#fff;
    background: linear-gradient(150deg, var(--accent) 0%, #1C1C1E 100%);
    box-shadow: var(--shadow);
  }
  .membership-price{ font-family: var(--font-display); font-size:38px; font-weight:700; }
  .membership-feat{ display:flex; gap:8px; align-items:flex-start; font-size:13.5px; padding:6px 0; }
  .membership-feat svg{ width:15px; height:15px; flex-shrink:0; margin-top:2px; }

  .empty{ text-align:center; padding: 30px 10px; color: var(--ink-soft); }
  .empty svg{ width:34px; height:34px; margin-bottom:10px; opacity:0.6; }

  .modal-backdrop{
    position:fixed; inset:0; background: rgba(10,15,12,0.5); z-index:20;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background: var(--surface); border-radius: 20px 20px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    width:100%; max-width:480px; box-shadow: var(--shadow);
  }
  .modal h3{ font-size:20px; margin-bottom:8px; }
  .modal p{ font-size:14px; color: var(--ink-soft); line-height:1.5; margin-bottom:16px; }
  .modal-scroll{ max-height:60vh; overflow-y:auto; margin-bottom:16px; }
  .modal-scroll p{ color: var(--ink); font-size:14px; line-height:1.5; margin-bottom:12px; }
  .modal-doc-version{ font-size:11.5px; color:var(--ink-soft); margin-bottom:14px; }
  .consent-check{ display:flex; align-items:flex-start; gap:10px; margin-bottom:12px; cursor:pointer; }
  .consent-check input{ margin-top:3px; width:18px; height:18px; flex-shrink:0; accent-color: var(--primary); }
  .consent-check span{ font-size:13.5px; line-height:1.45; color: var(--ink); }
  .consent-viewdoc{ margin:2px 0 0 28px; font-size:12.5px; color:var(--primary); font-weight:600; background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; }

  @media (prefers-reduced-motion: no-preference){
    .hmac-fill, .ring-fg{ transition: all 0.5s ease; }
    .card, .stat-tile{ transition: border-color 0.2s ease; }
  }
</style>
</head>
<body>


<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="brand-mark">K</div>
      <div>
        <div class="brand-name">KalibraFit</div>
        <div class="top-greeting" id="topGreeting"></div>
      </div>
    </div>
    <div id="topbarRight"></div>
  </header>

  <main id="content"></main>

  <nav id="bottomnav" hidden>
    <button class="nav-btn" data-action="nav" data-arg="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Inicio
    </button>
    <button class="nav-btn" data-action="nav" data-arg="meals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v7a3 3 0 006 0V2"/><path d="M6 2v20"/><path d="M18 2c-2 1-3 3-3 6s1 4 3 5v9"/></svg>
      Comidas
    </button>
    <button class="nav-btn" data-action="nav" data-arg="workouts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11"/><path d="M21 21l-3-3M3 3l3 3"/><path d="M15 5l4 4"/><path d="M5 15l4 4"/><rect x="2" y="14" width="4" height="4" rx="1" transform="rotate(-45 4 16)"/><rect x="18" y="6" width="4" height="4" rx="1" transform="rotate(-45 20 8)"/></svg>
      Entreno
    </button>
    <button class="nav-btn" data-action="nav" data-arg="progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      Progreso
    </button>
    <button class="nav-btn" data-action="nav" data-arg="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
      Perfil
    </button>
  </nav>
</div>

<div id="modalRoot"></div>


<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------- */
  /* IDIOMA                                                            */
  /* ---------------------------------------------------------------- */

  var LANGUAGES = [
    {code:"es", label:"Español", flag:"🇪🇸"},
    {code:"en", label:"English", flag:"🇬🇧"},
    {code:"it", label:"Italiano", flag:"🇮🇹"},
    {code:"pt", label:"Português (Brasil)", flag:"🇧🇷"}
  ];

  // Diccionario de traducción: cada clave trae sus 4 idiomas juntos, así se
  // ve de inmediato si falta alguno. t(key, vars) hace el lookup y reemplaza
  // {placeholders} por los valores dados.
  var T = {};
  function addT(entries){ Object.keys(entries).forEach(function(k){ T[k] = entries[k]; }); }

  function t(key, vars){
    var lang = state.language || "es";
    var row = T[key];
    var str = row ? (row[lang] || row.es) : key;
    if(vars){
      Object.keys(vars).forEach(function(k){
        str = str.split("{"+k+"}").join(vars[k]);
      });
    }
    return str;
  }

    "home.photoNoFood": { es:"No reconocimos comida en esa foto. Intenta con otra o ingrésalo a mano.", en:"We couldn't recognize food in that photo. Try another one or enter it manually.", it:"Non abbiamo riconosciuto cibo in quella foto. Provane un'altra o inseriscilo manualmente.", pt:"Não reconhecemos comida nessa foto. Tente outra ou insira manualmente." },
    "home.photoErrorGeneric": { es:"No pudimos analizar la foto justo ahora. Intenta de nuevo o ingrésalo a mano.", en:"We couldn't analyze the photo right now. Try again or enter it manually.", it:"Non siamo riusciti ad analizzare la foto in questo momento. Riprova o inseriscilo manualmente.", pt:"Não conseguimos analisar a foto agora. Tente de novo ou insira manualmente." },

    "trial.lockTitle": { es:"Tu prueba gratuita terminó", en:"Your free trial ended", it:"La tua prova gratuita è terminata", pt:"Seu teste grátis terminou" },
    "trial.lockText": { es:"Como no se activó la membresía, tus registros de la prueba no se guardaron. Solo las cuentas con membresía activa conservan su progreso — completa tus datos de nuevo para empezar y suscríbete cuando quieras para no perderlo la próxima vez.", en:"Since the membership wasn't activated, your trial records weren't saved. Only accounts with an active membership keep their progress — fill in your data again to start, and subscribe whenever you like so you don't lose it next time.", it:"Poiché l'abbonamento non è stato attivato, i tuoi dati di prova non sono stati salvati. Solo gli account con abbonamento attivo conservano i progressi — inserisci di nuovo i tuoi dati per iniziare e abbonati quando vuoi per non perderli la prossima volta.", pt:"Como a assinatura não foi ativada, seus registros do teste não foram salvos. Só contas com assinatura ativa mantêm o progresso — preencha seus dados novamente para começar, e assine quando quiser para não perder da próxima vez." },
    "paywall.title": { es:"Ya usaste tu prueba gratuita", en:"You already used your free trial", it:"Hai già usato la tua prova gratuita", pt:"Você já usou seu teste grátis" },
    "paywall.text": { es:"Este dispositivo ya tuvo sus 3 días gratis y no se activó la membresía, así que no corresponde otra prueba. Para volver a usar KalibraFit — y que esta vez tu progreso sí se guarde — activa el Plan Único.", en:"This device already had its 3 free days and the membership wasn't activated, so another trial isn't available. To use KalibraFit again — and have your progress actually saved this time — activate the Single Plan.", it:"Questo dispositivo ha già avuto i suoi 3 giorni gratis e l'abbonamento non è stato attivato, quindi non spetta un'altra prova. Per usare di nuovo KalibraFit — e far sì che stavolta i tuoi progressi vengano salvati — attiva il Piano Unico.", pt:"Este dispositivo já teve seus 3 dias grátis e a assinatura não foi ativada, então não há direito a outro teste. Para usar o KalibraFit de novo — e ter seu progresso realmente salvo desta vez — ative o Plano Único." },
    "paywall.devNote": { es:"Este botón no existiría en la app publicada — solo sirve para seguir probando la demo sin quedar bloqueado.", en:"This button wouldn't exist in the published app — it's only here to keep testing the demo without staying locked out.", it:"Questo pulsante non esisterebbe nell'app pubblicata — serve solo per continuare a provare la demo senza restare bloccati.", pt:"Este botão não existiria no app publicado — serve só para continuar testando a demo sem ficar bloqueado." },

    "alcohol.warnText": { es:"Estás por registrar {name} ({kcal} kcal). El alcohol suma calorías vacías, afecta tu descanso y tu progreso — bebe con moderación y nunca si vas a manejar. ¿Quieres registrarlo de todas formas?", en:"You're about to log {name} ({kcal} kcal). Alcohol adds empty calories and affects your rest and progress — drink in moderation and never before driving. Log it anyway?", it:"Stai per registrare {name} ({kcal} kcal). L'alcol aggiunge calorie vuote e influisce sul riposo e sui progressi — bevi con moderazione e mai prima di guidare. Vuoi registrarlo comunque?", pt:"Você está prestes a registrar {name} ({kcal} kcal). O álcool soma calorias vazias e afeta seu descanso e progresso — beba com moderação e nunca antes de dirigir. Registrar mesmo assim?" },

    "motivation.msg.1": { es:"La disciplina le gana al ánimo. No necesitas tener ganas, solo necesitas empezar.", en:"Discipline beats motivation. You don't need to feel like it, you just need to start.", it:"La disciplina batte la voglia. Non serve avere voglia, basta iniziare.", pt:"A disciplina vence o ânimo. Você não precisa ter vontade, só precisa começar." },
    "motivation.msg.2": { es:"Cada comida bien elegida y cada serie completa son ladrillos. Hoy pones uno más.", en:"Every good food choice and every completed set is a brick. Today you lay one more.", it:"Ogni pasto scelto bene e ogni serie completata è un mattone. Oggi ne posi uno in più.", pt:"Cada refeição bem escolhida e cada série completa é um tijolo. Hoje você põe mais um." },
    "motivation.msg.3": { es:"El cuerpo que quieres se construye en los días en que no tenías ganas y fuiste igual.", en:"The body you want is built on the days you didn't feel like it and showed up anyway.", it:"Il corpo che vuoi si costruisce nei giorni in cui non avevi voglia e ci sei stato comunque.", pt:"O corpo que você quer se constrói nos dias em que você não tinha vontade e foi mesmo assim." },
    "motivation.msg.4": { es:"No busques perfección, busca constancia. Un día promedio hecho es mejor que un día perfecto imaginado.", en:"Don't chase perfection, chase consistency. An average day done beats a perfect day imagined.", it:"Non cercare la perfezione, cerca la costanza. Un giorno medio fatto batte un giorno perfetto immaginato.", pt:"Não busque perfeição, busque constância. Um dia mediano feito vale mais que um dia perfeito imaginado." },

    "cue.leg_curl.2": { es:"Baja completo, sin dejar caer el peso de golpe.", en:"Lower it all the way, without letting the weight drop suddenly.", it:"Scendi completamente, senza lasciare cadere il peso di colpo.", pt:"Desça completo, sem deixar o peso cair de repente." },
    "cue.bridge.0": { es:"Empuja con los talones, no con la punta de los pies.", en:"Drive through your heels, not your toes.", it:"Spingi con i talloni, non con la punta dei piedi.", pt:"Empurre com os calcanhares, não com a ponta dos pés." },
    "cue.bridge.1": { es:"Aprieta el glúteo con fuerza arriba, con una pausa de un segundo.", en:"Squeeze your glutes hard at the top, with a one-second pause.", it:"Contrai il gluteo con forza in alto, con una pausa di un secondo.", pt:"Aperte o glúteo com força em cima, com uma pausa de um segundo." },
    "cue.bridge.2": { es:"Evita arquear la espalda baja — el movimiento nace en la cadera.", en:"Avoid arching your lower back — the movement comes from your hips.", it:"Evita di inarcare la schiena bassa — il movimento nasce dall'anca.", pt:"Evite arquear a lombar — o movimento nasce no quadril." },
    "cue.row_inverted.0": { es:"Cuerpo en línea recta de cabeza a talones, como una plancha.", en:"Body in a straight line from head to heels, like a plank.", it:"Corpo in linea retta dalla testa ai talloni, come un plank.", pt:"Corpo em linha reta da cabeça aos calcanhares, como uma prancha." },
    "cue.row_inverted.1": { es:"Lleva el pecho hacia la barra apretando el omóplato.", en:"Pull your chest to the bar by squeezing your shoulder blade.", it:"Porta il petto verso la sbarra stringendo la scapola.", pt:"Leve o peito em direção à barra apertando a escápula." },
    "cue.row_inverted.2": { es:"Mientras más horizontal esté tu cuerpo, más difícil es el ejercicio.", en:"The more horizontal your body is, the harder the exercise gets.", it:"Più il tuo corpo è orizzontale, più difficile è l'esercizio.", pt:"Quanto mais horizontal estiver seu corpo, mais difícil fica o exercício." },
    "cue.pulldown_standing.0": { es:"Codos apuntando hacia abajo y afuera, no hacia atrás.", en:"Elbows point down and out, not back.", it:"Gomiti puntati verso il basso e verso l'esterno, non indietro.", pt:"Cotovelos apontando para baixo e para fora, não para trás." },
    "cue.pulldown_standing.1": { es:"Lleva las manos hacia los muslos manteniendo el torso fijo.", en:"Bring your hands toward your thighs while keeping your torso fixed.", it:"Porta le mani verso le cosce mantenendo il busto fisso.", pt:"Leve as mãos em direção às coxas mantendo o tronco fixo." },
    "cue.pulldown_standing.2": { es:"Controla la vuelta arriba, no dejes que la banda te jale de golpe.", en:"Control the return up, don't let the band snap you back.", it:"Controlla il ritorno in alto, non lasciare che l'elastico ti tiri di colpo.", pt:"Controle a volta para cima, não deixe a faixa te puxar de repente." },
    "cue.lunge.0": { es:"Da un paso largo hacia adelante, manteniendo el torso erguido.", en:"Take a long step forward, keeping your torso upright.", it:"Fai un passo lungo in avanti, mantenendo il busto eretto.", pt:"Dê um passo longo à frente, mantendo o tronco ereto." },
    "cue.lunge.1": { es:"Baja hasta que ambas rodillas queden cerca de 90°, sin que la rodilla de adelante pase la punta del pie.", en:"Lower until both knees are near 90°, without the front knee passing your toes.", it:"Scendi finché entrambe le ginocchia sono vicine a 90°, senza che il ginocchio anteriore superi la punta del piede.", pt:"Desça até os dois joelhos ficarem perto de 90°, sem que o joelho da frente ultrapasse a ponta do pé." },
    "cue.lunge.2": { es:"Empuja con el talón de adelante para volver a la posición inicial.", en:"Push through your front heel to return to the start.", it:"Spingi con il tallone anteriore per tornare alla posizione iniziale.", pt:"Empurre com o calcanhar da frente para voltar à posição inicial." },
    "cue.cable_pushdown.0": { es:"Codos pegados al costado y fijos durante todo el movimiento.", en:"Elbows pinned to your sides and fixed through the whole movement.", it:"Gomiti attaccati ai fianchi e fissi per tutto il movimento.", pt:"Cotovelos colados ao corpo e fixos durante todo o movimento." },
    "cue.cable_pushdown.1": { es:"Extiende los antebrazos hacia abajo hasta que los brazos queden rectos.", en:"Extend your forearms down until your arms are straight.", it:"Estendi gli avambracci verso il basso finché le braccia sono dritte.", pt:"Estenda os antebraços para baixo até os braços ficarem retos." },
    "cue.cable_pushdown.2": { es:"Controla la vuelta arriba, sin dejar que el peso te levante los codos.", en:"Control the return up, without letting the weight lift your elbows.", it:"Controlla il ritorno in alto, senza lasciare che il peso ti sollevi i gomiti.", pt:"Controle a volta para cima, sem deixar o peso levantar seus cotovelos." },
    "cue.seated_row.0": { es:"Espalda recta, pecho arriba durante toda la serie.", en:"Straight back, chest up through the whole set.", it:"Schiena dritta, petto in su per tutta la serie.", pt:"Costas retas, peito para cima durante toda a série." },
    "cue.seated_row.1": { es:"Tira llevando los codos hacia atrás, apretando el omóplato al final.", en:"Pull by driving your elbows back, squeezing your shoulder blades at the end.", it:"Tira portando i gomiti indietro, stringendo le scapole alla fine.", pt:"Puxe levando os cotovelos para trás, apertando as escápulas no final." },
    "cue.seated_row.2": { es:"Vuelve controlando el peso, sin dejar caer el torso hacia adelante de golpe.", en:"Return under control, without letting your torso collapse forward.", it:"Torna controllando il peso, senza lasciare cadere il busto in avanti di colpo.", pt:"Volte controlando o peso, sem deixar o tronco cair para frente de repente." },
    "cue.rear_delt.0": { es:"Inclina el torso hacia adelante, manteniendo la espalda recta.", en:"Hinge your torso forward, keeping your back straight.", it:"Inclina il busto in avanti, mantenendo la schiena dritta.", pt:"Incline o tronco para frente, mantendo as costas retas." },
    "cue.rear_delt.1": { es:"Levanta los brazos hacia los lados con un codo ligeramente flexionado.", en:"Raise your arms out to the sides with a slight bend in your elbows.", it:"Alza le braccia lateralmente con una leggera flessione dei gomiti.", pt:"Levante os braços para os lados com uma leve flexão nos cotovelos." },
    "cue.rear_delt.2": { es:"Aprieta los omóplatos arriba, sin usar impulso del cuerpo.", en:"Squeeze your shoulder blades at the top, without swinging your body for momentum.", it:"Stringi le scapole in alto, senza usare lo slancio del corpo.", pt:"Aperte as escápulas em cima, sem usar embalo do corpo." },
    "cue.pike_pushup.0": { es:"Cadera bien arriba, formando una V invertida con el cuerpo.", en:"Hips high, forming an inverted V with your body.", it:"Anche ben in alto, formando una V rovesciata con il corpo.", pt:"Quadril bem alto, formando um V invertido com o corpo." },
    "cue.pike_pushup.1": { es:"Baja la cabeza hacia el suelo doblando los codos, sin mover la cadera.", en:"Lower your head toward the floor by bending your elbows, without moving your hips.", it:"Abbassa la testa verso il pavimento piegando i gomiti, senza muovere l'anca.", pt:"Desça a cabeça em direção ao chão dobrando os cotovelos, sem mover o quadril." },
    "cue.pike_pushup.2": { es:"Empuja de vuelta arriba manteniendo la posición de V.", en:"Push back up while keeping the V position.", it:"Spingi di nuovo in alto mantenendo la posizione a V.", pt:"Empurre de volta para cima mantendo a posição em V." }

  /** "1½", "2", "½" — nunca "0", nunca decimales feos. */
  function formatQty(rounded){
    var whole = Math.floor(rounded);
    var hasHalf = rounded - whole === 0.5;
    if(whole === 0) return "½";
    return hasHalf ? (whole+"½") : String(whole);
  }

  /**
   * Arma "2 huevos + ½ palta" escalando cada ingrediente por el mismo
   * `ratio` que ya escala las kcal/macros del plato. Las medidas de volumen
   * (taza, cucharada) que traen gramsPerUnit suman el peso en gramos entre
   * paréntesis — "1 taza de avena (85 g)" — porque "una taza" no dice nada
   * por sí solo.
   */
  function formatPortions(parts, ratio){
    if(!parts || parts.length === 0) return "";
    return parts.map(function(part){
      var rounded = Math.round(part.qty * ratio * 2) / 2;
      if(rounded <= 0) rounded = 0.5;
      var label = rounded === 1 ? part.name : (part.plural || part.name + "s");
      var text = formatQty(rounded) + " " + label;
      if(part.gramsPerUnit){
        var grams = Math.max(5, Math.round((rounded * part.gramsPerUnit) / 5) * 5);
        text += " (" + grams + " " + (part.unitLabel || "g") + ")";
      }
      return text;
    }).join(" + ");
  }

  // Igual que rotar un mazo de cartas — desplaza el pool `seed` posiciones
  // antes de elegir, sin repetir ítems ni cambiar su orden relativo. Con
  // seed=0 (o sin pasarlo) el resultado es idéntico al de siempre.
  function rotatePool(pool, seed){
    var n = pool.length;
    if(n === 0 || !seed) return pool;
    var offset = ((seed % n) + n) % n;
    return pool.slice(offset).concat(pool.slice(0, offset));
  }

  function pickFrom(pool, count, fromEnd, seed){
    var rotated = rotatePool(pool, seed || 0);
    var out = [];
    for(var i=0;i<count;i++){
      out.push(fromEnd ? rotated[rotated.length-1-i] : rotated[i]);
    }
    return out;
  }

  }

      var names = [pickFrom(poolPierna,1,false,seed)[0], pickFrom(poolPecho,1,false,seed)[0], pickFrom(poolEspalda,1,false,seed)[0], pickFrom(poolHombro,1,false,seed)[0]];

  // Qué patrones de movimiento se evitan según cada condición marcada en el
  // perfil — ajuste conservador y general, no una indicación clínica, por

  // (ver wk.conditionsNote).
  var PATTERN_RISK = {
    squat: ["rodillas"], leg_press: ["rodillas"], lunge: ["rodillas"],

  /**
   * Saca del pool los ejercicios cuyo patrón está marcado como riesgoso para
   * alguna condición del perfil. Si filtrar dejara el pool vacío (no debería
   * con los datos actuales, pero es un resguardo), se devuelve el pool
   * original antes que dejar una sesión sin ejercicios.
   */
  function filterForConditions(pool, conditions){
    if(!conditions || conditions.length === 0) return pool;
    var filtered = pool.filter(function(name){
      var pattern = EXO_PATTERN[name];
      var risk = pattern ? PATTERN_RISK[pattern] : null;
      if(!risk) return true;
      return !risk.some(function(c){ return conditions.indexOf(c) !== -1; });
    });
    return filtered.length > 0 ? filtered : pool;
  }

  // La figura se anima moviendo atributos SVG a mano con requestAnimationFrame
  // en vez de <animate> (SMIL): SMIL insertado via innerHTML falla en
  // silencio en algunos navegadores/WebViews de celular (el SVG completo no
  // llega a pintarse), así que esto es más lento de escribir pero funciona
  // en cualquier lado — solo depende de setAttribute, no de que el motor
  // soporte SMIL.
  function figLine(a1,a2,b1,b2,klass,animate){
    var attrs = 'x1="'+a1[0]+'" y1="'+a1[1]+'" x2="'+a2[0]+'" y2="'+a2[1]+'"';
    if(animate){
      attrs += ' data-anim="1" data-a1="'+a1[0]+','+a1[1]+'" data-b1="'+b1[0]+','+b1[1]+
        '" data-a2="'+a2[0]+','+a2[1]+'" data-b2="'+b2[0]+','+b2[1]+'"';
    }
    return '<line class="'+klass+'" '+attrs+'></line>';
  }
  function figCircle(a,b,r,klass,animate){
    var attrs = 'cx="'+a[0]+'" cy="'+a[1]+'" r="'+r+'"';
    if(animate){
      attrs += ' data-anim="1" data-a="'+a[0]+','+a[1]+'" data-b="'+b[0]+','+b[1]+'"';
    }
    return '<circle class="'+klass+'" '+attrs+'></circle>';
  }

  function renderFigure(patternKey, size){
    var P = PATTERNS[patternKey] || PATTERNS.push;
    var A = P.poseA, B = P.poseB || P.poseA;
    var animate = !REDUCE_MOTION;
    var dur = P.dur || 1.5;
    var parts = [];
    if(P.floorY){ parts.push('<line class="fig-floor" x1="12" y1="'+P.floorY+'" x2="88" y2="'+P.floorY+'"/>'); }
    if(P.fixedBar){ parts.push('<line class="fig-bar" x1="'+P.fixedBar[0]+'" y1="'+P.fixedBar[1]+'" x2="'+P.fixedBar[2]+'" y2="'+P.fixedBar[3]+'"/>'); }
    // Trazos gruesos + un circulo en cada articulacion -- asi se ve un
    // cuerpo con volumen en vez de un muñeco de palitos, sin cambiar el
    // dato de pose (mismos puntos, solo se dibujan mas "llenos").
    parts.push(figLine(A.hip,A.knee,B.hip,B.knee,"fig-limb",animate));
    parts.push(figLine(A.knee,A.foot,B.knee,B.foot,"fig-limb",animate));
    parts.push(figLine(A.shoulder,A.hip,B.shoulder,B.hip,"fig-torso",animate));
    parts.push(figLine(A.shoulder,A.elbow,B.shoulder,B.elbow,"fig-limb",animate));
    parts.push(figLine(A.elbow,A.hand,B.elbow,B.hand,"fig-limb",animate));
    parts.push(figCircle(A.shoulder,B.shoulder,5.5,"fig-joint-torso",animate));
    parts.push(figCircle(A.hip,B.hip,5.5,"fig-joint-torso",animate));
    parts.push(figCircle(A.elbow,B.elbow,4,"fig-joint-limb",animate));
    parts.push(figCircle(A.knee,B.knee,4,"fig-joint-limb",animate));
    parts.push(figCircle(A.hand,B.hand,4.5,"fig-joint-limb",animate));
    parts.push(figCircle(A.foot,B.foot,4.5,"fig-joint-limb",animate));
    parts.push(figCircle(A.head,B.head,9.5,"fig-head",animate));
    if(P.prop){
      var j = P.prop.joint;
      if(P.prop.type === "dumbbell"){
        parts.push(figCircle(A[j],B[j],4,"fig-prop",animate));
      } else if(P.prop.type === "bar"){
        var dx = P.prop.dx || 9;
        var pa1=[A[j][0]-dx,A[j][1]], pa2=[A[j][0]+dx,A[j][1]];
        var pb1=[B[j][0]-dx,B[j][1]], pb2=[B[j][0]+dx,B[j][1]];
        parts.push(figLine(pa1,pa2,pb1,pb2,"fig-prop",animate));
      }
    }
    return '<svg class="fig-svg" viewBox="0 0 100 100" width="'+size+'" height="'+size+'" data-dur="'+dur+'">'+parts.join("")+'</svg>';
  }

  var figureAnim = { raf: null };
  function clearFigureAnimation(){
    if(figureAnim.raf){ cancelAnimationFrame(figureAnim.raf); }
    figureAnim.raf = null;
  }
  function updateFigureFrame(svg, wave){
    Array.prototype.forEach.call(svg.querySelectorAll('line[data-anim]'), function(ln){
      var a1 = ln.dataset.a1.split(",").map(Number), b1 = ln.dataset.b1.split(",").map(Number);
      var a2 = ln.dataset.a2.split(",").map(Number), b2 = ln.dataset.b2.split(",").map(Number);
      ln.setAttribute("x1", a1[0] + (b1[0]-a1[0])*wave);
      ln.setAttribute("y1", a1[1] + (b1[1]-a1[1])*wave);
      ln.setAttribute("x2", a2[0] + (b2[0]-a2[0])*wave);
      ln.setAttribute("y2", a2[1] + (b2[1]-a2[1])*wave);
    });
    Array.prototype.forEach.call(svg.querySelectorAll('circle[data-anim]'), function(c){
      var a = c.dataset.a.split(",").map(Number), b = c.dataset.b.split(",").map(Number);
      c.setAttribute("cx", a[0] + (b[0]-a[0])*wave);
      c.setAttribute("cy", a[1] + (b[1]-a[1])*wave);
    });
  }
  // Arranca el bucle de animación de la figura del ejercicio. Va y vuelve
  // (0→1→0) como el "values=a;b;a" que usaba SMIL, con el mismo período que
  // definía cada patrón de movimiento.
  function startFigureAnimation(svg){
    if(REDUCE_MOTION || !svg) return;
    var periodMs = (Number(svg.dataset.dur) || 1.5) * 1000;
    var start = null;
    function frame(now){
      if(start === null) start = now;
      var t = ((now - start) % periodMs) / periodMs;
      var wave = t < 0.5 ? (t*2) : (2 - t*2);
      updateFigureFrame(svg, wave);
      figureAnim.raf = requestAnimationFrame(frame);
    }
    figureAnim.raf = requestAnimationFrame(frame);
  }

  var EX_LOOKUP = {};

  /* TEMPORIZADOR DE DESCANSO -- 3/4/5 min, dentro del modal de ejercicio */
  /* ---------------------------------------------------------------- */

  var restTimer = { seconds:0, total:0, running:false, handle:null };

  function clearRestTimer(){
    if(restTimer.handle){ clearInterval(restTimer.handle); }
    restTimer = { seconds:0, total:0, running:false, handle:null };
  }

  function formatMMSS(sec){
    sec = Math.max(0, sec);
    var m = Math.floor(sec/60), s = sec%60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }

  function renderTimerUI(){
    var display = document.getElementById("restTimerDisplay");
    var pauseBtn = document.getElementById("restTimerPauseBtn");
    if(!display) return; // el modal ya se cerro
    if(restTimer.total === 0){
      display.textContent = "--:--";
      display.style.color = "var(--ink-soft)";
    } else if(restTimer.seconds <= 0){
      display.textContent = t("modal.timerDone");
      display.style.color = "var(--primary)";
      display.style.fontSize = "18px";
    } else {
      display.textContent = formatMMSS(restTimer.seconds);
      display.style.color = "var(--ink)";
      display.style.fontSize = "32px";
    }
    if(pauseBtn) pauseBtn.textContent = restTimer.running ? t("modal.pause") : t("modal.resume");
  }

  function tickRestTimer(){
    restTimer.seconds--;
    if(restTimer.seconds <= 0){
      clearInterval(restTimer.handle);
      restTimer.handle = null;
      restTimer.running = false;
      restTimer.seconds = 0;
      try{
        if("Notification" in window && Notification.permission === "granted"){
          new Notification("KalibraFit", { body: t("modal.timerDone") });
        }
      }catch(e){}
    }
    renderTimerUI();
  }

  function startRestTimer(minutes){
    if(restTimer.handle) clearInterval(restTimer.handle);
    restTimer.total = minutes*60;
    restTimer.seconds = minutes*60;
    restTimer.running = true;
    requestNotifPermission();
    restTimer.handle = setInterval(tickRestTimer, 1000);
    renderTimerUI();
  }

  function pauseResumeRestTimer(){
    if(restTimer.total === 0) return;
    if(restTimer.running){
      clearInterval(restTimer.handle);
      restTimer.handle = null;
      restTimer.running = false;
    } else if(restTimer.seconds > 0){
      restTimer.handle = setInterval(tickRestTimer, 1000);
      restTimer.running = true;
    }
    renderTimerUI();
  }

  function resetRestTimer(){
    if(restTimer.handle) clearInterval(restTimer.handle);
    restTimer.seconds = restTimer.total;
    restTimer.running = false;
    restTimer.handle = null;
    renderTimerUI();
  }

  // OJO: nunca usar new Date().toISOString().slice(0,10) acá — toISOString()
  // siempre da la fecha en UTC, no en la hora local del navegador. Para
  // Chile (UTC-3/UTC-4) eso hacía que el "día" cambiara internamente 3-4

  // medianoche local quedaba guardado bajo el día siguiente. Los getters
  // locales (getFullYear/getMonth/getDate) sí respetan la zona horaria del

  var todayStr = function(){

  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var d = defaultState();
      // Merge en vez de reemplazar entero — así alguien que ya tenía datos
      // guardados (sin "snack" en mealTimes/mealReminders, sin
      // profile.conditions, sin supplements) no se queda con esos campos
      // undefined tras agregar comidas/funciones nuevas.
      return Object.assign(d, parsed, {
        profile: Object.assign(d.profile, parsed.profile||{}),
        mealTimes: Object.assign(d.mealTimes, parsed.mealTimes||{}),
        mealReminders: Object.assign(d.mealReminders, parsed.mealReminders||{})
      });
    }catch(e){ return defaultState(); }

  // Registra en consentLog quién aceptó qué, cuándo y en qué versión del
  // documento (append-only, nunca se borra un registro existente), y
  // actualiza el flag de acceso rápido correspondiente. entries:
  // [{type:"terms"|"privacy"|"health"|"marketing", accepted:true/false}]
  function recordConsent(entries){
    var now = new Date().toISOString();
    entries.forEach(function(en){
      state.consentLog.push({ type:en.type, accepted:en.accepted, version:LEGAL_VERSION, at:now });
      if(en.type === "terms") state.termsAccepted = en.accepted;
      else if(en.type === "privacy") state.privacyAccepted = en.accepted;
      else if(en.type === "health") state.healthDataAccepted = en.accepted;
      else if(en.type === "marketing") state.marketingOptIn = en.accepted;
    });
    saveState();
  }

  /* ---------------------------------------------------------------- */
  /* FOTO DE COMIDA -- estimacion de macros via backend propio          */
  /* ---------------------------------------------------------------- */
  // Un artifact estático no puede guardar una clave de API de forma
  // segura, así que el análisis lo hace un backend propio (proyecto
  // "kalibra-backend", listo para Vercel) que sí guarda la clave de
  // Anthropic como variable de entorno del servidor — nunca acá.
  // Mientras FOOD_ANALYZE_URL esté vacío, la función de foto queda oculta
  // y se usa el formulario manual de siempre (diseño pensado para la
  // ausencia, igual que el resto de la app).
  // Vacío a propósito: los Artifacts de Claude bloquean fetch() a
  // cualquier servidor externo (política de seguridad de la plataforma),
  // así que esta función nunca puede andar acá — sí funciona en la copia
  // standalone publicada en Vercel junto al backend (kalibra-backend/public/index.html).
  var FOOD_ANALYZE_URL = "/api/analyze-food"; // mismo origen: no hace falta URL absoluta
  var FOOD_ANALYZE_SECRET = "rojo";

  // Redimensiona la foto en un <canvas> antes de mandarla — más rápido de
  // subir, más barato de analizar, y de paso evita mandar fotos gigantes
  // de celulares modernos sin necesidad.
  function fileToResizedBase64(file, maxSide){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("read_error")); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error("decode_error")); };
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxSide / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, cw, ch);
          var dataUrl = canvas.toDataURL("image/jpeg", 0.85);
          resolve(dataUrl.split(",")[1]);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function handleFoodPhoto(file){
    if(!file || !FOOD_ANALYZE_URL) return;
    var statusEl = document.getElementById("photoStatus");
    if(statusEl){ statusEl.style.color = "var(--ink-soft)"; statusEl.textContent = t("home.analyzingPhoto"); }
    fileToResizedBase64(file, 1024).catch(function(err){
      err.stage = "resize";
      throw err;
    }).then(function(base64){
      var headers = { "content-type": "application/json" };
      if(FOOD_ANALYZE_SECRET) headers["x-app-secret"] = FOOD_ANALYZE_SECRET;
      return fetch(FOOD_ANALYZE_URL, {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ image: base64, mediaType: "image/jpeg" })
      });
    }).then(function(res){
      return res.json().catch(function(){ return null; }).then(function(data){ return { ok: res.ok, status: res.status, data: data }; });
    }).then(function(result){
      if(!statusEl) return;
      var data = result.data;
      if(!result.ok || !data || data.error){
        if(data && data.error === "no_food"){
          statusEl.style.color = "var(--warn)"; statusEl.textContent = t("home.photoNoFood");
          return;
        }
        // El detalle real (que podría traer info interna del servidor)
        // queda solo en la consola del navegador para depurar -- a la
        // persona usuaria le mostramos un mensaje genérico, no un texto
        // técnico ni nada devuelto crudo por el servidor.
        var detail = (data && (data.error || data.message)) || ("HTTP " + result.status);
        console.error("analyze-food error:", detail);
        statusEl.style.color = "var(--warn)";
        statusEl.textContent = t("home.photoErrorGeneric");
        return;
      }
      var name = String(data.name || "").trim();
      var kcal = Math.round(Number(data.kcal));
      if(!name || !kcal || kcal <= 0 || !isFinite(kcal)){
        statusEl.style.color = "var(--warn)"; statusEl.textContent = t("home.photoNoFood");
        return;
      }
      var p = Math.max(0, Math.round(Number(data.p) || 0));
      var c = Math.max(0, Math.round(Number(data.c) || 0));
      var f = Math.max(0, Math.round(Number(data.f) || 0));
      statusEl.style.color = "var(--ink-soft)"; statusEl.textContent = "";
      fillFoodFormFromAI(name, kcal, p, c, f);
    }).catch(function(err){
      if(!statusEl) return;
      statusEl.style.color = "var(--warn)";
      var detail = ((err && err.stage) ? (err.stage + ": ") : "") + ((err && err.message) || String(err));
      console.error("analyze-food error:", detail);
      statusEl.textContent = t("home.photoErrorGeneric");
    });
  }

  /* ---------------------------------------------------------------- */
  /* RECORDATORIOS                                                     */
  /* ---------------------------------------------------------------- */
  // Los recordatorios funcionan de dos formas a la vez:
  // 1) Aviso dentro de la app (siempre funciona, cualquier navegador): un
  //    banner en Inicio cuando llega la hora de una comida con recordatorio
  //    activo, mientras la pestaña esté abierta.
  // 2) Notificación del sistema operativo (best-effort): si el navegador la
  //    soporta y el usuario da permiso, se dispara igual con la pestaña de
  //    fondo. Safari en iPhone no la soporta salvo que la app esté agregada
  //    a la pantalla de inicio — por eso el aviso #1 es el que garantiza
  //    que el usuario se entere.
  var reminderTimeouts = [];

  function requestNotifPermission(){
    try{
      if("Notification" in window && Notification.permission === "default"){
        Notification.requestPermission();
      }
    }catch(e){}
  }

  function scheduleReminders(){
    reminderTimeouts.forEach(function(id){ clearTimeout(id); });
    reminderTimeouts = [];
    var notifOk = false;
    try{ notifOk = ("Notification" in window) && Notification.permission === "granted"; }catch(e){}
    if(!notifOk) return;

    Object.keys(state.mealReminders).forEach(function(type){
      if(!state.mealReminders[type]) return;
      var parts = (state.mealTimes[type] || "").split(":");
      if(parts.length !== 2) return;
      var target = new Date();
      target.setHours(Number(parts[0]), Number(parts[1]), 0, 0);
      var msUntil = target.getTime() - Date.now();
      if(msUntil <= 0 || msUntil > 24*60*60*1000) return;
      var id = setTimeout(function(){
        try{
          new Notification("KalibraFit", { body: t("home.reminderBanner",{meal:t(MEAL_TITLES[type]),time:state.mealTimes[type]}) });
        }catch(e){}
      }, msUntil);
      reminderTimeouts.push(id);
    });

    // aviso de membresia 15 min antes de que venza la prueba gratis
    var mem = membershipStatus();
    if(mem.status === "trial" && mem.remainingMs > TRIAL_WARN_MS){
      var msUntilWarn = mem.remainingMs - TRIAL_WARN_MS;
      if(msUntilWarn <= 24*60*60*1000){
        var trialId = setTimeout(function(){
          try{ new Notification("KalibraFit", { body: t("home.trialReminderBanner",{min:15}) }); }catch(e){}
        }, msUntilWarn);
        reminderTimeouts.push(trialId);
      }
    }
  }

  // Comidas con recordatorio activo cuya hora ya llegó (o pasó por menos de
  // 90 min) y que el usuario no descartó hoy — se muestra en Inicio.
  function dueReminders(){
    var now = new Date();
    var nowMin = now.getHours()*60 + now.getMinutes();
    var dismissedToday = state.dismissedReminders[todayStr()] || {};
    return Object.keys(state.mealReminders).filter(function(type){
      if(!state.mealReminders[type] || dismissedToday[type]) return false;
      var parts = (state.mealTimes[type] || "").split(":");
      if(parts.length !== 2) return false;
      var targetMin = Number(parts[0])*60 + Number(parts[1]);
      var diff = nowMin - targetMin;
      return diff >= 0 && diff <= 90;
    });
  }

  /* ---------------------------------------------------------------- */
  /* MEMBRESIA -- 3 dias gratis, luego $6.990 CLP/mes                 */
  /* ---------------------------------------------------------------- */

  var TRIAL_MS = 3 * 24 * 60 * 60 * 1000;
  var TRIAL_WARN_MS = 15 * 60 * 1000; // avisar 15 min antes de que venza

  // { status: "active" | "trial" | "expired", remainingMs? }
  function membershipStatus(){
    if(state.subscribed) return { status:"active" };
    if(!state.trialStart){
      // Sin trialStart hay dos casos muy distintos: alguien nuevo que
      // todavía no terminó su registro (le corresponde una prueba
      // completa) o alguien que ya gastó su única prueba gratuita, volvió
      // a registrarse y sigue sin pagar (no le damos otra prueba gratis).
      return state.trialUsed ? { status:"expired" } : { status:"trial", remainingMs: TRIAL_MS };
    }
    var elapsed = Date.now() - new Date(state.trialStart).getTime();
    var remaining = TRIAL_MS - elapsed;
    if(remaining > 0) return { status:"trial", remainingMs: remaining };
    return { status:"expired" };
  }

  // Si la prueba gratuita venció y la persona nunca activó la membresía,
  // sus registros no se conservan: se descarta el estado (perfil, comidas,
  // agua, peso, rutina completada) y se vuelve al formulario de registro,
  // como si fuera la primera vez — pero marcando trialUsed para que, si se
  // registra de nuevo, no reciba otra prueba gratis (ver render(), que la
  // manda a renderPaywall() en ese caso). Solo dispara este reseteo cuando
  // había una prueba realmente corriendo que acaba de vencer (trialStart
  // presente) — así no se repite en bucle sobre alguien que ya está
  // bloqueado en la pantalla de pago (trialUsed sin trialStart).
  function checkTrialExpiryLock(){
    if(!state.onboarded || state.subscribed) return;
    if(!state.trialStart) return;
    if(membershipStatus().status !== "expired") return;
    var keepLang = state.language;
    state = defaultState();
    state.language = keepLang;
    state.trialUsed = true;
    saveState();
    showModal(t("trial.lockTitle"), t("trial.lockText"), t("modal.ok"), null);
  }

  function formatDuration(ms){
    var totalMin = Math.max(0, Math.ceil(ms/60000));
    var d = Math.floor(totalMin/1440);
    var h = Math.floor((totalMin%1440)/60);
    var m = totalMin%60;
    if(d > 0) return t("time.days",{d:d,h:h});
    if(h > 0) return t("time.hours",{h:h,m:m});
    return t("time.minutes",{m:m});
  }

  /* ---------------------------------------------------------------- */
  /* CALCULATIONS                                                      */
  /* ---------------------------------------------------------------- */

  function targets(p){
    var bmr = p.sex === "hombre"
      ? 10*p.weight + 6.25*p.height - 5*p.age + 5
      : 10*p.weight + 6.25*p.height - 5*p.age - 161;
    var actMap = {sedentario:1.2, ligero:1.375, moderado:1.55, alto:1.725, muyalto:1.9};
    var tdee = bmr * (actMap[p.activity] || 1.375);
    var adj = p.goal === "bajar" ? tdee*0.8 : p.goal === "ganar" ? tdee*1.12 : tdee;
    var floor = p.sex === "hombre" ? 1500 : 1200;
    var kcal = Math.max(Math.round(adj/10)*10, floor);
    var proteinFactor = p.goal === "bajar" ? 2.2 : p.goal === "ganar" ? 1.9 : 2.0;
    var proteinG = Math.round(p.weight * proteinFactor);
    var fatKcal = kcal * 0.27;
    var fatG = Math.round(fatKcal/9);
    var carbKcal = Math.max(kcal - proteinG*4 - fatKcal, 0);
    var carbG = Math.round(carbKcal/4);
    return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal: kcal, proteinG: proteinG, carbG: carbG, fatG: fatG };
  }

  var WATER_GLASS_ML = 250;

  // 35 ml por kg de peso corporal al día es la referencia que usan
  // nutricionistas y coaches para una recomendación general de hidratación
  // (más precisa que el mito fijo de "8 vasos" para todos). Se suma un
  // extra si entrenas fuerte casi todos los días, y se acota a un rango
  // seguro para pesos muy bajos o muy altos.
  function calcWaterTargetMl(p){
    var base = p.weight * 35;
    if(p.activity === "alto" || p.activity === "muyalto") base += 400;
    base = Math.max(1500, Math.min(4000, base));
    return Math.round(base/50)*50;
  }

  function weeksToGoal(p){
    if(p.goal === "mantener" || !p.goalWeight) return null;
    var diff = Math.abs(p.weight - p.goalWeight);
    if(diff < 0.5) return 0;
    var rate = p.goal === "bajar" ? 0.5 : 0.3;
    return Math.ceil(diff / rate);
  }

  function bmi(p){
    // Resguardo contra division por cero (estatura 0 -> "Infinity" en
    // pantalla) -- mismo resguardo que la app nativa.
    var m = Math.max(p.height, 1)/100;
    return Math.max(p.weight, 0) / (m*m);
  }
  function bmiLabel(v){
    if(v < 18.5) return t("bmi.low");
    if(v < 25) return t("bmi.normal");
    if(v < 30) return t("bmi.over");
    return t("bmi.obesity");
  }

  // Todo el peso se guarda SIEMPRE en kg (profile.weight, goalWeight,
  // weightLog) -- esto solo convierte para MOSTRAR/INGRESAR en libras
  // cuando la persona elige "lb". Ningun calculo (IMC, TDEE, proteina por
  // kg) toca estas funciones, asi que la unidad elegida nunca afecta un
  // resultado, solo la pantalla.
  var KG_PER_LB = 0.45359237;
  function kgToLb(kg){ return kg / KG_PER_LB; }
  function lbToKg(lb){ return lb * KG_PER_LB; }
  function kgToUnit(kg, unit){ return unit === "lb" ? kgToLb(kg) : kg; }
  function unitToKg(v, unit){ return unit === "lb" ? lbToKg(v) : v; }
  function formatWeight(kg, unit){ return kgToUnit(kg, unit).toFixed(1) + " " + unit; }

  /** Par de botones chicos "kg"/"lb" -- se repite junto a cada campo/valor de peso. */
  function weightUnitToggleHTML(){
    return '<div style="display:flex;gap:6px;">' +
      ["kg","lb"].map(function(u){
        var active = state.weightUnit === u;
        return '<button type="button" data-action="setweightunit" data-arg="'+u+'" style="padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid '+(active?"var(--primary)":"var(--line)")+';background:'+(active?"var(--primary-soft)":"var(--surface)")+';color:'+(active?"var(--primary)":"var(--ink-soft)")+';">'+u+'</button>';
      }).join("") +
      '</div>';
  }

  // Cuánto del día le corresponde a cada comida — desayuno liviano, almuerzo
  // como comida principal (típico en Chile), once liviana, cena moderada.
  // Suman 100%, así que desayuno+almuerzo+once+cena cubren exactamente la
  // meta calórica del día, no una aproximación.
  var MEAL_SHARE = { desayuno:0.2, snack:0.1, almuerzo:0.35, once:0.1, cena:0.25 };

  // Horario sugerido de cada comida — espaciadas para sostener el apetito
  // y la energía durante el día, con la cena al menos 2h antes de
  // acostarse. Son horas, no necesitan traducción por idioma.
  var MEAL_TIME = { desayuno:"07:00 – 09:00", snack:"10:00 – 10:30", almuerzo:"13:00 – 14:30", once:"17:00 – 18:30", cena:"20:00 – 21:30" };

  // Tragos comunes en Chile con su calorías aproximadas — tocar uno lo
  // marca como el agua, y suma directo a las calorías del día (no aporta
  // proteína/carbos/grasas, el alcohol es su propio macronutriente).
  var ALCOHOL_DRINKS = [
    { key:"drink.cerveza", kcal:150 },
    { key:"drink.vino", kcal:125 },
    { key:"drink.piscola", kcal:180 },
    { key:"drink.vodka", kcal:160 },
    { key:"drink.roncola", kcal:180 },
    { key:"drink.corto", kcal:110 },
    { key:"drink.espumante", kcal:90 }
  ];

  // Solo un check diario (como el agua) — no suman a las kcal/macros del
  // día. Si alguien quiere que su proteína en polvo cuente en sus macros,
  // la puede registrar como una comida normal.
  var SUPPLEMENT_ORDER = ["creatina","proteina","omega3","vitaminaC","magnesio","zinc"];

  function buildMealPlan(kcalTarget, seed){
    var order = ["desayuno","snack","almuerzo","once","cena"];
    var runningSum = 0;
    var scaled = order.map(function(type, i){
      var arr = FOODS[type];
      var base = arr[(seed + i) % arr.length];
      var isLast = i === order.length - 1;
      var kcalForMeal;
      if(isLast){
        // La última comida absorbe lo que sobra del redondeo de las otras,
        // así la suma del día cierra EXACTA con la meta, no solo aproximada.
        kcalForMeal = kcalTarget - runningSum;
      } else {
        kcalForMeal = Math.round((kcalTarget * MEAL_SHARE[type])/10)*10;
      }
      runningSum += kcalForMeal;
      var ratio = Math.max(0.4, Math.min(2.2, kcalForMeal / base.kcal));
      return {
        type: type, n: base.n,
        kcal: kcalForMeal,
        p: Math.round(base.p*ratio), c: Math.round(base.c*ratio), f: Math.round(base.f*ratio),
        portionText: formatPortions(base.portions, ratio)
      };
    });
    var totals = scaled.reduce(function(s,it){
      s.kcal+=it.kcal; s.p+=it.p; s.c+=it.c; s.f+=it.f; return s;
    }, {kcal:0,p:0,c:0,f:0});
    return { items: scaled, totals: totals };
  }

  function buildWorkoutPlan(location, goal, days, conditions, seed){
    var loc = location === "gym" ? "gym" : "casa";
    var lib = MUSCLE_EXO[loc];
    var template = SPLIT_TEMPLATES[days] || SPLIT_TEMPLATES[4];

    return template.map(function(day){
      if(day.blocks === "__ALT__"){
        return buildFridayAlt(loc, goal, currentWeekParity(), conditions, seed);
      }
      var exercises = [];
      day.blocks.forEach(function(block){
        var group = block[0], count = block[1];
        var pool = filterForConditions(lib[group] || [], conditions);
        var picks = pickFrom(pool, Math.min(count, pool.length), false, seed);
        picks.forEach(function(name, i){
          // El primer ejercicio de un grupo grande (pecho/espalda/pierna/hombro)
          // es el movimiento principal; el resto, accesorio.
          var isMainLift = (group==="pecho"||group==="espalda"||group==="pierna"||group==="hombro") && i===0;
          exercises.push(makeExercise(name, isMainLift ? "compound" : "isolation", goal));
        });
      });
      return { day: day.day, title: day.title, exercises: exercises, note: COACH_NOTES[day.note], extra: day.extra || null };
    });
  }

  var MUSCLE_LABEL = { pecho:"Pecho", espalda:"Espalda", pierna:"Pierna", hombro:"Hombro", triceps:"Tríceps", biceps:"Bíceps" };
  var MUSCLE_ORDER = ["pecho","espalda","pierna","hombro","triceps","biceps"];

  /** Busca en qué grupo muscular (casa o gym) vive un ejercicio, por su nombre exacto -- para mostrar "Trabaja: Pierna" en la ficha de detalle. */
  function muscleGroupForExercise(name){
    var locs = ["casa","gym"];
    for(var i=0;i<locs.length;i++){
      for(var j=0;j<MUSCLE_ORDER.length;j++){
        var group = MUSCLE_ORDER[j];
        if(MUSCLE_EXO[locs[i]][group].indexOf(name) !== -1) return group;
      }
    }
    return null;
  }

  // Qué parte de su grupo muscular enfatiza cada ejercicio — mismo criterio
  // y mismos valores que la app nativa (exercises.ts, ver el comentario
  // largo ahí con el detalle de cada grupo). Un solo mapa plano por nombre
  // exacto, igual que EXO_PATTERN. Bíceps queda sin mapear a propósito —
  // ninguno de sus ejercicios tiene una posición de brazo que permita
  // distinguir con confianza qué cabeza enfatiza.
  var EXO_SUBREGION = {
    // Pecho
    "Flexiones de pecho estándar": "medio",
    "Flexiones inclinadas (pies elevados)": "alto",
    "Flexiones declinadas (manos elevadas)": "bajo",
    "Fondos en silla (pecho)": "bajo",
    "Flexiones con palmada": "medio",
    "Press de banca con barra": "medio",
    "Press inclinado con mancuernas": "alto",
    "Aperturas en polea (cruce)": "medio",
    "Fondos en paralelas (pecho)": "bajo",
    "Press en máquina": "medio",
    // Hombro
    "Flexión pica (pike push-up)": "anterior",
    "Elevaciones laterales con botellas de agua": "lateral",
    "Elevaciones posteriores inclinado con banda": "posterior",
    "Press militar con banda elástica": "anterior",
    "Press militar con barra": "anterior",
    "Elevaciones laterales con mancuernas": "lateral",
    "Elevaciones posteriores (pájaros)": "posterior",
    "Press Arnold con mancuernas": "anterior",
    // Espalda
    "Remo invertido bajo mesa": "grosor",
    "Remo con banda elástica a una mano": "grosor",
    "Superman": "lumbar",
    "Peso muerto rumano con mochila": "lumbar",
    "Jalón con banda en puerta": "ancho",
    "Dominadas (o jalón al pecho)": "ancho",
    "Remo con barra": "grosor",
    "Remo en polea baja sentado": "grosor",
    "Peso muerto convencional": "lumbar",
    "Pull-over en polea": "ancho",
    // Pierna
    "Sentadilla con salto": "cuadriceps",
    "Zancadas caminando": "cuadriceps",
    "Puente de glúteo a una pierna": "gluteo",
    "Sentadilla búlgara en silla": "cuadriceps",
    "Peso muerto rumano a una pierna": "isquiotibiales",
    "Elevación de talones de pie": "pantorrilla",
    "Sentadilla con barra": "cuadriceps",
    "Prensa de piernas": "cuadriceps",
    "Peso muerto rumano": "isquiotibiales",
    "Zancadas con mancuernas": "cuadriceps",
    "Curl femoral en máquina": "isquiotibiales",
    // Tríceps
    "Fondos en banco (tríceps)": "cabezaLateral",
    "Extensión de tríceps con banda elástica": "cabezaLarga",
    "Flexiones diamante": "cabezaMedial",
    "Extensión de tríceps en polea": "cabezaLateral",
    "Press francés con barra Z": "cabezaLarga",
    "Fondos en máquina asistida": "cabezaLateral"
  };
  function exerciseSubRegion(name){ return EXO_SUBREGION[name] || null; }

  // Sesión libre por grupo muscular — independiente del split fijo de la
  // semana y de los días/semana elegidos en el perfil. Usa todo el pool de
  // ese músculo, no un recorte de un bloque.
  function buildMuscleSession(location, muscleKey, goal, conditions){
    var loc = location === "gym" ? "gym" : "casa";
    var pool = filterForConditions(MUSCLE_EXO[loc][muscleKey] || [], conditions);
    var isBigGroup = (muscleKey==="pecho"||muscleKey==="espalda"||muscleKey==="pierna"||muscleKey==="hombro");
    var exercises = pool.map(function(name, i){
      var isMainLift = isBigGroup && i===0;
      return makeExercise(name, isMainLift ? "compound" : "isolation", goal);
    });
    return { title: MUSCLE_LABEL[muscleKey], exercises: exercises };
  }

  /* ---------------------------------------------------------------- */
  /* SMALL HELPERS                                                     */
  /* ---------------------------------------------------------------- */

  function el(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }

  // Para cuando un texto que escribió la persona (nombre, etc.) tiene que
  // insertarse dentro de un innerHTML junto a otro HTML — sin esto,
  // alguien podría poner algo como <img src=x onerror=...> como su nombre
  // y quedaría ejecutándose cada vez que se abre su propio Perfil.
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function fmt(n){ return Math.round(n).toLocaleString("es-CL"); }
  function clamp01(v){ return Math.max(0, Math.min(1, v)); }
  function dayLabelShort(dateStr){
    var days = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
    return days[new Date(dateStr+"T00:00:00").getDay()];

  var contentEl = document.getElementById("content");
  var bottomNav = document.getElementById("bottomnav");
  var topGreeting = document.getElementById("topGreeting");
  var topbarRight = document.getElementById("topbarRight");

  // Sugerencia de a qué comida corresponde algo que se está registrando
  // ahora, según la hora — la persona igual puede cambiarla tocando otra
  // pestaña en el selector.
  function defaultMealTypeForNow(){
    var h = new Date().getHours();
    if(h < 9) return "desayuno";
    if(h < 11) return "snack";
    if(h < 16) return "almuerzo";
    if(h < 19) return "once";

  }

  function greetingText(){
    var h = new Date().getHours();
    var base = h < 12 ? t("top.morning") : h < 19 ? t("top.afternoon") : t("top.night");
    var name = state.profile.name ? ", " + state.profile.name.split(" ")[0] : "";

  function updateNavLabels(){
    ["home","meals","workouts","progress","profile"].forEach(function(screen){
      var btn = bottomNav.querySelector('[data-arg="'+screen+'"]');
      if(!btn) return;
      var label = btn.lastChild;
      if(label && label.nodeType === 3){ label.textContent = " " + t("nav."+screen) + " "; }

  function render(){
    checkTrialExpiryLock();
    if(!state.onboarded){
      bottomNav.hidden = true;
      topGreeting.textContent = t("top.tagline");
      topbarRight.innerHTML = "";
      contentEl.innerHTML = "";
      contentEl.appendChild(renderOnboarding());
      return;
    }
    topGreeting.textContent = greetingText();
    var mem = membershipStatus();

    // Ya se registró antes, ya gastó su única prueba gratuita y sigue sin
    // pagar: no vuelve a resetearse (eso sería un bucle infinito de pruebas
    // gratis) — se queda bloqueado en una pantalla de pago, sin acceso al
    // resto de la app, hasta que se suscriba.
    if(mem.status === "expired" && state.trialUsed && !state.trialStart){
      bottomNav.hidden = true;
      topbarRight.innerHTML = '<span class="pill warn">'+t("top.trialExpired")+'</span>';
      contentEl.innerHTML = "";
      contentEl.appendChild(renderPaywall());
      return;
    }

    bottomNav.hidden = false;
    updateNavLabels();
    if(mem.status === "active"){
      topbarRight.innerHTML = '<span class="pill ok">'+t("top.member")+'</span>';
    } else if(mem.status === "trial"){
      var warn = mem.remainingMs <= TRIAL_WARN_MS;
      topbarRight.innerHTML = '<span class="pill '+(warn?"warn":"accent")+'">'+t("top.trialDays",{time:formatDuration(mem.remainingMs)})+'</span>';
    } else {
      topbarRight.innerHTML = '<span class="pill warn">'+t("top.trialExpired")+'</span>';
    }

    Array.prototype.forEach.call(bottomNav.querySelectorAll(".nav-btn"), function(b){
      var activeArg = state.screen === "history" ? "progress" : state.screen;
      b.classList.toggle("active", b.dataset.arg === activeArg);
    });

    contentEl.innerHTML = "";
    var view;
    if(state.screen === "home") view = renderHome();
    else if(state.screen === "meals") view = renderMeals();
    else if(state.screen === "workouts") view = renderWorkouts();
    else if(state.screen === "progress") view = renderProgress();
    else if(state.screen === "history") view = renderHistory();
    else if(state.screen === "profile") view = renderProfile();
    contentEl.appendChild(view);
  }

      [["mujer","ob.sex.mujer"],["hombre","ob.sex.hombre"]].forEach(function(opt){
