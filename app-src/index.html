      wrap.appendChild(sexField);

      var grid = el('<div class="grid-2"></div>');
      var fAge = el('<div class="field"><label>'+t("ob.age.label")+'</label><input type="number" min="14" max="90" data-field="age"/></div>');
      fAge.querySelector("input").value = p.age;
      var fHeight = el('<div class="field"><label>'+t("ob.height.label")+'</label><input type="number" min="120" max="230" data-field="height"/></div>');
      fHeight.querySelector("input").value = p.height;
      grid.appendChild(fAge); grid.appendChild(fHeight);
      wrap.appendChild(grid);

      var fWeight = el('<div class="field"><div class="row" style="margin-bottom:6px;"><label style="margin:0;">'+t("ob.weight.label")+'</label>'+weightUnitToggleHTML()+'</div><input type="number" min="'+Math.round(kgToUnit(30,state.weightUnit))+'" max="'+Math.round(kgToUnit(250,state.weightUnit))+'" step="0.1" data-field="weight"/></div>');
      fWeight.querySelector("input").value = kgToUnit(p.weight, state.weightUnit).toFixed(1);
      wrap.appendChild(fWeight);

      wrap.appendChild(el('<button class="btn btn-primary" data-action="ob-next">'+t("ob.continue")+'</button>'));
    }

    if(state.obStep === 2){
      wrap.appendChild(el('<h1 style="font-size:26px;margin-bottom:6px;">'+t("ob.step2.title")+'</h1>'));
      wrap.appendChild(el('<p class="ob-hero">'+t("ob.step2.sub")+'</p>'));

      var goalField = el('<div class="field"><label>'+t("ob.goal.label")+'</label><div class="seg" data-seg="goal"></div></div>');
      var goalSeg = goalField.querySelector(".seg");
      Object.keys(GOAL_LABELS).forEach(function(k){
        var b = el('<button type="button" data-action="segpick" data-val="'+k+'">'+t("goal."+k)+'</button>');
        if(p.goal===k) b.classList.add("active");
        goalSeg.appendChild(b);
      });
      wrap.appendChild(goalField);

      if(p.goal !== "mantener"){
        var fGoalW = el('<div class="field"><div class="row" style="margin-bottom:6px;"><label style="margin:0;">'+t("ob.goalWeight.label")+'</label>'+weightUnitToggleHTML()+'</div><input type="number" min="'+Math.round(kgToUnit(30,state.weightUnit))+'" max="'+Math.round(kgToUnit(250,state.weightUnit))+'" step="0.1" data-field="goalWeight"/></div>');
        fGoalW.querySelector("input").value = kgToUnit(p.goalWeight, state.weightUnit).toFixed(1);
        wrap.appendChild(fGoalW);
      }

      var actField = el('<div class="field"><label>'+t("ob.activity.label")+'</label><select data-field="activity"></select></div>');
      var sel = actField.querySelector("select");
      Object.keys(ACTIVITY_LABELS).forEach(function(k){
        var o = el('<option value="'+k+'">'+t("activity."+k)+'</option>');
        if(p.activity===k) o.selected = true;
        sel.appendChild(o);
      });
      wrap.appendChild(actField);

      var row = el('<div class="row"></div>');
      row.appendChild(el('<button class="btn btn-ghost" data-action="ob-back">'+t("ob.back")+'</button>'));
      row.appendChild(el('<button class="btn btn-primary" data-action="ob-next" style="flex:1">'+t("ob.continue")+'</button>'));
      wrap.appendChild(row);
    }

    if(state.obStep === 3){
      wrap.appendChild(el('<h1 style="font-size:26px;margin-bottom:6px;">'+t("ob.step3.title")+'</h1>'));
      wrap.appendChild(el('<p class="ob-hero">'+t("ob.step3.sub")+'</p>'));

      var locField = el('<div class="field"><label>'+t("ob.location.label")+'</label><div class="seg" data-seg="location"></div></div>');
      var locSeg = locField.querySelector(".seg");
      Object.keys(LOCATION_LABELS).forEach(function(k){
        var b = el('<button type="button" data-action="segpick" data-val="'+k+'">'+t("location."+k)+'</button>');
        if(p.location===k) b.classList.add("active");
        locSeg.appendChild(b);
      });
      wrap.appendChild(locField);

      var daysField = el('<div class="field"><label>'+t("ob.days.label")+'</label><select data-field="days"></select></div>');
      var dsel = daysField.querySelector("select");
      [3,4,5].forEach(function(d){
        var o = el('<option value="'+d+'">'+t("ob.days.option",{n:d})+'</option>');
        if(p.days===d) o.selected = true;
        dsel.appendChild(o);
      });
      wrap.appendChild(daysField);

      var row = el('<div class="row"></div>');
      row.appendChild(el('<button class="btn btn-ghost" data-action="ob-back">'+t("ob.back")+'</button>'));
      row.appendChild(el('<button class="btn btn-primary" data-action="ob-next" style="flex:1">'+t("ob.continue")+'</button>'));
      wrap.appendChild(row);
    }

    if(state.obStep === 4){
      wrap.appendChild(el('<h1 style="font-size:26px;margin-bottom:6px;">'+t("consent.health.title")+'</h1>'));
      wrap.appendChild(el('<p class="ob-hero">'+t("consent.health.text")+'</p>'));

      var healthCheck = el('<label class="consent-check"><input type="checkbox" data-action="toggleob" data-arg="obHealthConsent"/><span>'+t("consent.health.checkbox")+'</span></label>');
      healthCheck.querySelector("input").checked = !!state.obHealthConsent;
      wrap.appendChild(healthCheck);
      wrap.appendChild(el('<button type="button" class="consent-viewdoc" data-action="viewlegaldoc" data-arg="health">'+t("consent.viewDoc")+'</button>'));

      var row4 = el('<div class="row" style="margin-top:16px;"></div>');
      row4.appendChild(el('<button class="btn btn-ghost" data-action="ob-back">'+t("ob.back")+'</button>'));
      row4.appendChild(el('<button class="btn btn-primary" data-action="ob-health-continue" style="flex:1">'+t("ob.continue")+'</button>'));
      wrap.appendChild(row4);
    }

    if(state.obStep === 5){
      wrap.appendChild(el('<h1 style="font-size:26px;margin-bottom:6px;">'+t("ob.conditions.title")+'</h1>'));
      wrap.appendChild(el('<p class="ob-hero">'+t("ob.conditions.sub")+'</p>'));

      var condField = el('<div class="field"><div class="seg" id="conditionsSeg"></div></div>');
      var condSeg = condField.querySelector(".seg");
      ["espalda","rodillas","hombro","cardio","embarazo"].forEach(function(k){
        var b = el('<button type="button" data-action="condpick" data-arg="'+k+'">'+t("condition."+k)+'</button>');
        if((p.conditions||[]).indexOf(k) !== -1) b.classList.add("active");
        condSeg.appendChild(b);
      });
      wrap.appendChild(condField);

      wrap.appendChild(el('<p style="font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:20px;">'+t("ob.conditions.disclaimer")+'</p>'));

      var row5 = el('<div class="row"></div>');
      row5.appendChild(el('<button class="btn btn-ghost" data-action="ob-back">'+t("ob.back")+'</button>'));
      row5.appendChild(el('<button class="btn btn-primary" data-action="ob-next" style="flex:1">'+t("ob.continue")+'</button>'));
      wrap.appendChild(row5);
    }

    if(state.obStep === 6){
      wrap.appendChild(el('<h1 style="font-size:26px;margin-bottom:6px;">'+t("consent.legal.title")+'</h1>'));
      wrap.appendChild(el('<p class="ob-hero">'+t("consent.legal.sub")+'</p>'));

      var termsCheck = el('<label class="consent-check"><input type="checkbox" data-action="toggleob" data-arg="obTermsChecked"/><span>'+t("consent.legal.terms")+'</span></label>');
      termsCheck.querySelector("input").checked = !!state.obTermsChecked;
      wrap.appendChild(termsCheck);
      wrap.appendChild(el('<button type="button" class="consent-viewdoc" data-action="viewlegaldoc" data-arg="terms">'+t("consent.viewDoc")+'</button>'));

      var privacyCheck = el('<label class="consent-check" style="margin-top:14px;"><input type="checkbox" data-action="toggleob" data-arg="obPrivacyChecked"/><span>'+t("consent.legal.privacy")+'</span></label>');
      privacyCheck.querySelector("input").checked = !!state.obPrivacyChecked;
      wrap.appendChild(privacyCheck);
      wrap.appendChild(el('<button type="button" class="consent-viewdoc" data-action="viewlegaldoc" data-arg="privacy">'+t("consent.viewDoc")+'</button>'));

      var marketingCheck = el('<label class="consent-check" style="margin-top:14px;"><input type="checkbox" data-action="toggleob" data-arg="obMarketingChecked"/><span>'+t("consent.legal.marketing")+'</span></label>');
      marketingCheck.querySelector("input").checked = !!state.obMarketingChecked;
      wrap.appendChild(marketingCheck);

      var row6 = el('<div class="row" style="margin-top:16px;"></div>');
      row6.appendChild(el('<button class="btn btn-ghost" data-action="ob-legal-back">'+t("ob.back")+'</button>'));
      var finishBtn = el('<button class="btn btn-primary" data-action="ob-finish" style="flex:1">'+t("ob.finish")+'</button>');
      if(!state.obTermsChecked || !state.obPrivacyChecked) finishBtn.disabled = true;
      row6.appendChild(finishBtn);
      wrap.appendChild(row6);
    }

    return wrap;
  }

  /* ---------------------------------------------------------------- */
  /* RENDER: HOME                                                      */
  /* ---------------------------------------------------------------- */

  function renderHome(){
    var tg = targets(state.profile);
    var log = todayLog();
    var consumed = log.reduce(function(s,it){ return s + it.kcal; }, 0);
    var pC = log.reduce(function(s,it){ return s+it.p; },0);
    var cC = log.reduce(function(s,it){ return s+it.c; },0);
    var fC = log.reduce(function(s,it){ return s+it.f; },0);
    var remaining = tg.kcal - consumed;
    var pct = clamp01(consumed / tg.kcal);
    var over = consumed > tg.kcal;

    var wrap = el('<div></div>');

    var hero = el('<div class="hero-card"></div>');
    hero.innerHTML =
      '<div class="hero-top">'+
        '<div><div class="hero-label">'+t("home.caloriesToday")+'</div>'+
        '<div class="ring-num">'+fmt(Math.max(remaining,0))+'</div>'+
        '<div class="ring-sub">'+(over ? t("home.kcalOver") : t("home.kcalAvailable"))+'</div></div>'+
        '<div class="pill" style="background:rgba(255,255,255,0.18);color:#fff;">'+fmt(consumed)+' / '+fmt(tg.kcal)+' kcal</div>'+
      '</div>'+
      '<div style="height:8px;background:rgba(255,255,255,0.22);border-radius:6px;margin-top:16px;overflow:hidden;">'+
        '<div style="height:100%;width:'+(pct*100)+'%;background:'+(over?"#E28776":"#fff")+';border-radius:6px;"></div>'+
      '</div>'+
      '<div class="hero-macros">'+
        macroBlock(t("home.protein"), pC, tg.proteinG, "g")+
        macroBlock(t("home.carbs"), cC, tg.carbG, "g")+
        macroBlock(t("home.fats"), fC, tg.fatG, "g")+
      '</div>';
    wrap.appendChild(hero);

    // aviso de membresia por vencer (15 min antes)
    var memStatusHome = membershipStatus();
    if(memStatusHome.status === "trial" && memStatusHome.remainingMs <= TRIAL_WARN_MS
       && (!state.trialReminderDismissed || (Date.now()-new Date(state.trialReminderDismissed).getTime()) > TRIAL_WARN_MS)){
      var trialBanner = el('<div class="reminder-banner" style="margin-top:14px;background:var(--warn-soft);border-color:var(--warn);"></div>');
      trialBanner.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'+
        '<div class="reminder-banner-text">'+t("home.trialReminderBanner",{min:Math.max(1,Math.ceil(memStatusHome.remainingMs/60000))})+'</div>'+
        '<button class="btn btn-primary btn-sm" data-action="subscribe" style="flex-shrink:0;">'+t("home.renewNow")+'</button>'+
        '<button class="reminder-banner-close" data-action="dismisstrialbanner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
      wrap.appendChild(trialBanner);
    }

    // avisos de comidas cuya hora ya llegó
    dueReminders().forEach(function(type){
      var banner = el('<div class="reminder-banner" style="margin-top:14px;"></div>');
      banner.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>'+
        '<div class="reminder-banner-text">'+t("home.reminderBanner",{meal:t(MEAL_TITLES[type]),time:state.mealTimes[type]})+'</div>'+
        '<button class="reminder-banner-close" data-action="dismissreminder" data-arg="'+type+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
      wrap.appendChild(banner);
    });

    // registrar lo que vas comiendo — sección dedicada, suma directo al anillo de arriba
    wrap.appendChild(el('<div class="section-title" style="margin-top:20px;"><h2>'+t("home.addWhatYouAte")+'</h2></div>'));
    var addCard = el('<div class="card"></div>');
    var defaultMealType = defaultMealTypeForNow();
    var manualFieldsHTML =
      '<div id="manualFoodFields" data-meal-type="'+defaultMealType+'"'+(FOOD_ANALYZE_URL ? " hidden" : "")+'>'+
        '<div id="aiEstimateNote" style="font-size:12px;color:var(--primary);margin-bottom:10px;display:none;">'+t("home.aiEstimateNote")+'</div>'+
        '<div class="field" style="margin-bottom:10px;">'+
          '<label>'+t("home.whichMeal")+'</label>'+
          '<div class="seg" id="mealTypeSeg">'+
            [["desayuno","meal.desayuno"],["snack","meal.snack"],["almuerzo","meal.almuerzo"],["once","meal.once"],["cena","meal.cena"]].map(function(m){
              return '<button type="button" data-action="pickmealtype" data-arg="'+m[0]+'"'+(m[0]===defaultMealType?' class="active"':'')+'>'+t(m[1])+'</button>';
            }).join("") +
          '</div>'+
        '</div>'+
        '<div class="field" style="margin-bottom:10px;"><input type="text" id="foodNameInput" placeholder="'+t("home.whatDidYouEat")+'"/></div>'+
        '<div class="grid-2" style="margin-bottom:10px;">'+
          '<div class="field" style="margin-bottom:0;"><input type="number" inputmode="decimal" min="0" id="foodKcalInput" placeholder="'+t("home.caloriesPlaceholder")+'"/></div>'+
          '<div class="field" style="margin-bottom:0;"><input type="number" inputmode="decimal" min="0" id="foodProteinInput" placeholder="'+t("home.proteinPlaceholder")+'"/></div>'+
        '</div>'+
        '<div class="grid-2" style="margin-bottom:4px;">'+
          '<div class="field" style="margin-bottom:0;"><input type="number" inputmode="decimal" min="0" id="foodCarbInput" placeholder="'+t("home.carbsPlaceholder")+'"/></div>'+
          '<div class="field" style="margin-bottom:0;"><input type="number" inputmode="decimal" min="0" id="foodFatInput" placeholder="'+t("home.fatsPlaceholder")+'"/></div>'+
        '</div>'+
        '<p style="font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;">'+t("home.macrosOptional")+'</p>'+
        '<button class="btn btn-primary btn-block" data-action="addcustomfood">'+t("home.addToLog")+'</button>'+
        '<div id="foodFormError" style="font-size:12px;color:var(--warn);margin-top:8px;min-height:14px;"></div>'+
      '</div>';
    if(FOOD_ANALYZE_URL){
      // Hay analisis de foto disponible: la foto es la forma principal de
      // registrar, el formulario manual queda como respaldo detrás de un
      // toggle (y es exactamente donde aterriza el resultado de la IA para
      // que la persona lo revise antes de guardarlo).
      addCard.innerHTML =
        '<p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.5;">'+t("home.photoIntro")+'</p>'+
        '<input type="file" id="foodPhotoInput" accept="image/*" capture="environment" hidden>'+
        '<button type="button" class="btn btn-primary btn-block" data-action="takefoodphoto">'+t("home.takePhoto")+'</button>'+
        '<div id="photoStatus" style="font-size:12.5px;margin-top:10px;min-height:16px;line-height:1.4;"></div>'+
        '<button type="button" id="toggleManualBtn" class="btn btn-line btn-sm btn-block" data-action="togglemanualfood" style="margin-top:12px;margin-bottom:14px;">'+t("home.enterManually")+'</button>'+
        manualFieldsHTML;
    } else {
      addCard.innerHTML = manualFieldsHTML;
    }
    // alcohol — desplegable, mismo lugar donde se registra el resto de lo
    // que comiste/tomaste. Se marca lo que vas a tomar y se suma directo
    // al registro de hoy (mismo espíritu que el agua, pero con aviso de
    // conciencia antes de guardar).
    var alcoholPanelHTML =
      '<div id="alcoholPanel" hidden style="margin-top:14px;">'+
        '<p style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;">'+t("home.alcoholNote")+'</p>'+
        '<div class="seg" id="alcoholGrid">'+
          ALCOHOL_DRINKS.map(function(d){
            return '<button type="button" data-action="addalcohol" data-arg="'+d.key+'">'+t(d.key)+' · '+d.kcal+' kcal</button>';
          }).join("") +
        '</div>'+
        '<p id="alcoholSummary" style="font-size:12.5px;color:var(--ink);margin-top:12px;font-weight:600;"></p>'+
      '</div>';
    addCard.insertAdjacentHTML("beforeend",
      '<button type="button" id="toggleAlcoholBtn" class="btn btn-line btn-sm btn-block" data-action="togglealcoholpanel" style="margin-top:12px;">'+t("home.alcoholToggle")+'</button>'+
      alcoholPanelHTML
    );
    var todayAlc = log.filter(function(it){ return it.type === "alcohol"; });
    var alcKcal = todayAlc.reduce(function(s,it){ return s+it.kcal; }, 0);
    addCard.querySelector("#alcoholSummary").textContent = todayAlc.length ? t("home.alcoholToday",{n:todayAlc.length,kcal:fmt(alcKcal)}) : t("home.alcoholNone");
    wrap.appendChild(addCard);

    // atajo: agregar directo una comida del plan generado
    var quick = el('<div class="card" style="margin-top:14px;"></div>');
    quick.innerHTML = '<div class="row" style="margin-bottom:2px;"><h3 style="font-size:15px;">'+t("home.quickFromPlan")+'</h3></div>';
    var qgrid = el('<div class="seg" style="margin-top:8px;"></div>');
    [["desayuno","meal.desayuno"],["snack","meal.snack"],["almuerzo","meal.almuerzo"],["once","meal.once"],["cena","meal.cena"]].forEach(function(m){
      var b = el('<button type="button" data-action="quickadd" data-arg="'+m[0]+'">'+t(m[1])+' <span class="mono" style="font-size:11px;opacity:0.7;">'+MEAL_TIME[m[0]].split(" –")[0]+'</span></button>');
      qgrid.appendChild(b);
    });
    quick.appendChild(qgrid);
    wrap.appendChild(quick);

    // today's log
    wrap.appendChild(el('<div class="section-title"><h2>'+t("home.todayLog")+'</h2></div>'));
    var logCard = el('<div class="card"></div>');
    if(log.length === 0){
      logCard.appendChild(el('<div class="empty">'+t("home.emptyLog").split("\n").join("<br/>")+'</div>'));
    } else {
      var mealTypeLabel = { desayuno:"meal.desayuno", snack:"meal.snack", almuerzo:"meal.almuerzo", once:"meal.once", cena:"meal.cena" };
      log.forEach(function(item, idx){
        var row = el('<div class="food-row"><div><div class="food-name"></div><div class="food-meta"></div></div><div style="display:flex;align-items:center;gap:10px;"><div class="food-kcal"></div><button class="icon-btn" data-action="removefood" data-arg="'+idx+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>');
        row.querySelector(".food-name").textContent = item.n;
        var metaText = "P "+item.p+"g · C "+item.c+"g · G "+item.f+"g";
        if(mealTypeLabel[item.type]) metaText = t(mealTypeLabel[item.type]) + " · " + metaText;
        row.querySelector(".food-meta").textContent = metaText;
        row.querySelector(".food-kcal").textContent = item.kcal + " kcal";
        logCard.appendChild(row);
      });
    }
    wrap.appendChild(logCard);

    // water
    wrap.appendChild(el('<div class="section-title"><h2>'+t("home.water")+'</h2></div>'));
    var waterTargetMl = calcWaterTargetMl(state.profile);
    var glassesTarget = Math.round(waterTargetMl / WATER_GLASS_ML);
    var water = todayWater();
    var waterMl = water * WATER_GLASS_ML;
    wrap.appendChild(el('<p style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;">'+t("home.waterGoal",{ml:fmt(waterTargetMl),glasses:glassesTarget,glassMl:WATER_GLASS_ML}).replace(fmt(waterTargetMl)+" ml", '<strong style="color:var(--ink);">'+fmt(waterTargetMl)+' ml</strong>')+'</p>'));
    var waterCard = el('<div class="card"></div>');
    var waterTop = el('<div class="row"></div>');
    waterTop.innerHTML = '<div class="mono" style="font-size:14px;font-weight:600;color:var(--ink);">'+fmt(waterMl)+' / '+fmt(waterTargetMl)+' ml</div>'+
      '<div class="pill '+(waterMl>=waterTargetMl?"ok":"")+'">'+Math.round(clamp01(waterMl/waterTargetMl)*100)+'%</div>';
    waterCard.appendChild(waterTop);
    var wdots = el('<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;"></div>');
    for(var i=0;i<glassesTarget;i++){
      var full = i < water;
      wdots.appendChild(el('<div style="width:18px;height:24px;border-radius:5px;border:1.5px solid '+(full? "var(--primary)":"var(--line)")+';background:'+(full?"var(--primary-soft)":"transparent")+';"></div>'));
    }
    waterCard.appendChild(wdots);
    var wbtns = el('<div style="display:flex;gap:6px;margin-top:12px;"></div>');
    wbtns.appendChild(el('<button class="btn btn-ghost btn-sm" data-action="water-" >'+t("home.minus250")+'</button>'));
    wbtns.appendChild(el('<button class="btn btn-ghost btn-sm" data-action="water+">'+t("home.plus250")+'</button>'));
    waterCard.appendChild(wbtns);
    wrap.appendChild(waterCard);

    // suplementos — un check diario, como el agua: no suman a las
    // kcal/macros del día
    wrap.appendChild(el('<div class="section-title"><h2>'+t("home.supplements")+'</h2></div>'));
    var suppCard = el('<div class="card"></div>');
    suppCard.appendChild(el('<p style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;">'+t("home.supplementsNote")+'</p>'));
    var suppGrid = el('<div class="seg"></div>');
    var todaySupp = state.supplements[todayStr()] || {};
    SUPPLEMENT_ORDER.forEach(function(k){
      var b = el('<button type="button" data-action="togglesupp" data-arg="'+k+'">'+t("supp."+k)+'</button>');
      if(todaySupp[k]) b.classList.add("active");
      suppGrid.appendChild(b);
    });
    suppCard.appendChild(suppGrid);
    wrap.appendChild(suppCard);

    return wrap;
  }

  function macroBlock(label, val, target, unit){
    var pct = clamp01(val/Math.max(target,1))*100;
    return '<div class="hmac"><div class="hmac-label">'+label+'</div><div class="hmac-bar"><div class="hmac-fill" style="width:'+pct+'%"></div></div><div class="hmac-val">'+fmt(val)+' / '+fmt(target)+unit+'</div></div>';
  }

  /* ---------------------------------------------------------------- */
  /* RENDER: MEALS                                                     */
  /* ---------------------------------------------------------------- */

  var MEAL_TITLES = {desayuno:"meal.desayuno", snack:"meal.snack", almuerzo:"meal.almuerzo", once:"meal.once", cena:"meal.cena"};

  function goalExplanation(p, tg){
    if(p.goal === "bajar"){
      var pctDown = Math.round((1 - tg.kcal/tg.tdee)*100);
      return { tag: t("meals.tagDeficit"), text: t("meals.explainDeficit",{tdee:fmt(tg.tdee),kcal:fmt(tg.kcal),pct:pctDown,protein:tg.proteinG}) };
    }
    if(p.goal === "ganar"){
      var pctUp = Math.round((tg.kcal/tg.tdee - 1)*100);
      return { tag: t("meals.tagSurplus"), text: t("meals.explainSurplus",{tdee:fmt(tg.tdee),kcal:fmt(tg.kcal),pct:pctUp,protein:tg.proteinG}) };
    }
    return { tag: t("meals.tagMaintenance"), text: t("meals.explainMaintenance",{kcal:fmt(tg.kcal),protein:tg.proteinG}) };
  }

    var tg = targets(state.profile);

  /* ---------------------------------------------------------------- */

  // Construye la lista de ejercicios tocables (fila + chevron + extra +
  // nota del coach), reutilizada tanto por el split semanal como por la
  // sesión libre de grupo muscular.
  // Los datos de días/notas/extra viven en español dentro de SPLIT_TEMPLATES
  // y COACH_NOTES (identidad interna, sin tocar) — estos mapas solo traducen
  // lo que se muestra en pantalla, buscando el texto español exacto.
  var WEEKDAY_KEY = {"Lunes":"weekday.lunes","Martes":"weekday.martes","Miércoles":"weekday.miercoles","Jueves":"weekday.jueves","Viernes":"weekday.viernes"};
  var TITLE_KEY = {
    "Empuje — Pecho, Hombro y Tríceps":"day.empuje", "Tirón — Espalda y Bíceps":"day.tiron",
    "Pierna completa":"day.pierna", "Pecho y Tríceps":"day.pechoTriceps", "Espalda y Bíceps":"day.espaldaBiceps",
    "Hombro y Brazos":"day.hombroBrazos", "Hombro":"day.hombro", "Full Body":"day.fullbody",
    "Brazos — Tríceps y Bíceps":"day.brazos"
  };
  var EXTRA_KEY = {"Plancha abdominal — 3×40s":"day.plankExtra40", "Plancha abdominal — 3×30s":"day.plankExtra30"};
  var NOTE_KEY_BY_TEXT = {};
  Object.keys(COACH_NOTES).forEach(function(k){ NOTE_KEY_BY_TEXT[COACH_NOTES[k]] = k; });

  function trWeekday(s){ return WEEKDAY_KEY[s] ? t(WEEKDAY_KEY[s]) : s; }
  function trDayTitle(s){ return TITLE_KEY[s] ? t(TITLE_KEY[s]) : s; }
  function trExtra(s){ return EXTRA_KEY[s] ? t(EXTRA_KEY[s]) : s; }
  function trCoachNote(s){ var k = NOTE_KEY_BY_TEXT[s]; return k ? t("coach."+k) : s; }

  function buildExerciseListEl(exercises, extra, note){
    var list2 = el('<div class="wk-ex-list"></div>');

      EX_LOOKUP[ex.name] = ex;
      var row = el('<div class="wk-ex tappable" data-action="showex" data-arg="'+encodeURIComponent(ex.name)+'"><div class="wk-ex-text"><div class="wk-ex-name"></div><div class="wk-ex-scheme"></div></div><svg class="wk-ex-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>');
      row.querySelector(".wk-ex-name").textContent = trName(ex.name) + (ex.kind==="compound" ? "  ·  "+t("wk.principal") : "");
      row.querySelector(".wk-ex-scheme").textContent = ex.sets+"×"+ex.reps+" · "+t("wk.rest")+" "+ex.rest;
      list2.appendChild(row);
    });
    if(extra){
      var extraRow = el('<div class="wk-ex" style="border-top:1px dashed var(--line);"><div class="wk-ex-name" style="color:var(--ink-soft);font-style:italic;"></div></div>');
      extraRow.querySelector(".wk-ex-name").textContent = t("wk.extraOptional",{extra:trExtra(extra)});
      list2.appendChild(extraRow);
    }
    if(note){
      var noteRow = el('<div style="margin-top:8px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-soft);line-height:1.5;"></div>');
      noteRow.textContent = t("wk.coachNoteLabel",{note:trCoachNote(note)});
      list2.appendChild(noteRow);
    }
    return list2;
  }

    wrap.appendChild(list);

  /* ---------------------------------------------------------------- */
  /* RENDER: PROGRESS                                                  */
  /* ---------------------------------------------------------------- */

  function computeStreak(){
    var days = Object.keys(state.completion).sort().reverse();
    var streak = 0;
    for(var i=0;i<days.length;i++){
      var c = state.completion[days[i]];
      var any = Object.keys(c).some(function(k){ return c[k]; });
      if(any) streak++; else break;
    }
    return streak;
  }

  function renderProgress(){
    var p = state.profile;
    var wrap = el('<div></div>');
    var titleRow = el('<div class="row" style="margin:6px 0 14px;"></div>');
    titleRow.appendChild(el('<h1 style="font-size:24px;margin:0;">'+t("progress.title")+'</h1>'));
    titleRow.appendChild(el('<button class="btn btn-line btn-sm" data-action="viewhistory">'+t("history.viewButton")+'</button>'));
    wrap.appendChild(titleRow);

    var grid = el('<div class="grid-2"></div>');
    var b = bmi(p);
    grid.appendChild(statTile(t("progress.bmi"), b.toFixed(1), bmiLabel(b)));
    var wk = weeksToGoal(p);
    grid.appendChild(statTile(t("progress.goalEstimate"), wk===null ? "—" : (wk===0? t("progress.achieved") : wk+" "+t("progress.weeks")), wk===null? t("progress.maintenance") : t("progress.healthyPace")));
    wrap.appendChild(grid);

    var grid2 = el('<div class="grid-2" style="margin-top:12px;"></div>');
    grid2.appendChild(statTile(t("progress.streak"), computeStreak(), t("progress.streakSub")));

    var weightTitleRow = el('<div class="section-title"></div>');
    weightTitleRow.innerHTML = '<h2>'+t("progress.weightLog")+'</h2>';

    chartCard.appendChild(weightChart());

    var input = el('<input type="number" step="0.1" placeholder="'+t("progress.weightPlaceholder",{unit:state.weightUnit})+'" style="flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface);color:var(--ink);font-size:14px;"/>');
    var btn = el('<button class="btn btn-primary btn-sm" data-action="logweight">'+t("progress.save")+'</button>');
    input.id = "weightInput";
    addRow.appendChild(input); addRow.appendChild(btn);

  function statTile(label, val, sub){
    var t = el('<div class="stat-tile"></div>');
    t.innerHTML = '<div class="eyebrow">'+label+'</div><div class="num">'+val+'</div><div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">'+sub+'</div>';
    return t;
  }

  function weightChart(){
    var log = state.weightLog.slice(-10);
    var wrapDiv = el('<div class="chart-wrap"></div>');
    if(log.length < 2){
      wrapDiv.appendChild(el('<div class="empty" style="padding:20px 0;">'+t("progress.chartEmpty").split("\n").join("<br/>")+'</div>'));
      return wrapDiv;
    }
    var W=400,H=140,padL=34,padR=10,padT=14,padB=20;
    var vals = log.map(function(d){return d.weight;});
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if(min===max){ min-=1; max+=1; }
    var xw = (W-padL-padR)/(log.length-1);
    function X(i){ return padL + i*xw; }
    function Y(v){ return padT + (1-(v-min)/(max-min))*(H-padT-padB); }
    var pts = log.map(function(d,i){ return X(i)+","+Y(d.weight); }).join(" ");
    var area = "M"+padL+","+(H-padB)+" L"+pts.split(" ").join(" L")+" L"+X(log.length-1)+","+(H-padB)+" Z";
    var svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:140px;">'+
      '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(H-padB)+'" stroke="var(--line)" stroke-width="1"/>'+
      '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="var(--line)" stroke-width="1"/>'+
      '<text x="4" y="'+(padT+4)+'">'+formatWeight(max, state.weightUnit)+'</text>'+
      '<text x="4" y="'+(H-padB+4)+'">'+formatWeight(min, state.weightUnit)+'</text>'+
      '<path d="'+area+'" fill="var(--primary-soft)" opacity="0.6"/>'+
      '<polyline points="'+pts+'" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
      '<circle cx="'+X(log.length-1)+'" cy="'+Y(log[log.length-1].weight)+'" r="4" fill="var(--primary)"/>'+
      log.map(function(d,i){ return i%2===0 ? '<text x="'+X(i)+'" y="'+(H-4)+'" text-anchor="middle">'+dayLabelShort(d.date)+'</text>' : ''; }).join('') +
      '</svg>';
    wrapDiv.innerHTML = svg;
    return wrapDiv;
  }

  /* ---------------------------------------------------------------- */
  /* RENDER: HISTORIAL                                                 */
  /* ---------------------------------------------------------------- */

  var HISTORY_MAX_DAYS = 30;

  /** "2026-09-11" -> "11-09-2026" (formato chileno) — sin librerías de fecha. */
  function formatDateChile(dateStr){
    var parts = dateStr.split("-");
    return parts[2]+"-"+parts[1]+"-"+parts[0];
  }

  function renderHistory(){
    var wrap = el('<div></div>');
    wrap.appendChild(el('<button class="btn-line" style="border:none;background:none;color:var(--primary);font-weight:700;font-size:14px;padding:0;margin-bottom:14px;" data-action="backhistory">‹ '+t("history.back")+'</button>'));
    wrap.appendChild(el('<h1 style="font-size:24px;margin:0 0 4px;">'+t("history.title")+'</h1>'));
    wrap.appendChild(el('<p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;line-height:1.5;">'+t("history.sub")+'</p>'));

    var dateSet = {};
    Object.keys(state.logs).forEach(function(d){ dateSet[d]=1; });
    Object.keys(state.water).forEach(function(d){ dateSet[d]=1; });
    Object.keys(state.supplements).forEach(function(d){ dateSet[d]=1; });
    Object.keys(state.completion).forEach(function(d){ dateSet[d]=1; });
    state.weightLog.forEach(function(w){ dateSet[w.date]=1; });
    var dates = Object.keys(dateSet).sort().reverse().slice(0, HISTORY_MAX_DAYS);

    if(dates.length === 0){
      wrap.appendChild(el('<p style="color:var(--ink-soft);font-size:13.5px;">'+t("history.empty")+'</p>'));
      return wrap;
    }

    dates.forEach(function(date){
      wrap.appendChild(buildHistoryDayCard(date));
    });
    return wrap;
  }

  function buildHistoryDayCard(date){
    var items = state.logs[date] || [];
    var kcal = items.reduce(function(s,it){ return s+it.kcal; }, 0);
    var waterGlasses = state.water[date] || 0;
    var supp = state.supplements[date] || {};
    var takenSupp = SUPPLEMENT_ORDER.filter(function(k){ return supp[k]; });
    var workoutsDone = Object.keys(state.completion[date]||{}).filter(function(k){ return state.completion[date][k]; }).length;
    var weightEntry = state.weightLog.filter(function(w){ return w.date===date; })[0];

    var card = el('<div class="card" style="padding:0;overflow:hidden;"></div>');
    var head = el('<div class="wk-day-head" data-action="togglehistoryday" data-arg="'+date+'" style="cursor:pointer;"></div>');
    head.innerHTML =
      '<div><div class="wk-day-title">'+formatDateChile(date)+'</div>'+
      '<div class="wk-day-sub">'+(items.length>0 ? (fmt(kcal)+' kcal · '+items.length+' '+t("history.items")) : t("history.noFood"))+'</div></div>'+
      '<svg class="muscle-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
    card.appendChild(head);

    var body = el('<div class="wk-ex-list" hidden></div>');
    items.forEach(function(it){
      var row = el('<div class="food-row"><div class="food-name"></div><div class="food-kcal"></div></div>');
      row.querySelector(".food-name").textContent = it.n;
      row.querySelector(".food-kcal").textContent = it.kcal+" kcal";
      body.appendChild(row);
    });
    body.appendChild(historyRow(t("home.water"), fmt(waterGlasses*WATER_GLASS_ML)+" ml"));
    body.appendChild(historyRow(t("home.supplements"), takenSupp.length ? takenSupp.map(function(k){return t("supp."+k);}).join(", ") : t("history.none")));
    body.appendChild(historyRow(t("wk.title"), workoutsDone>0 ? t("history.workoutsDone",{n:workoutsDone}) : t("history.none")));
    if(weightEntry){ body.appendChild(historyRow(t("progress.weightLog"), formatWeight(weightEntry.weight, state.weightUnit))); }
    card.appendChild(body);
    return card;
  }

  function historyRow(label, value){
    var r = el('<div class="row" style="border-top:1px solid var(--line);padding:8px 0;margin:0;"></div>');
    r.innerHTML = '<span style="font-size:12px;color:var(--ink-soft);">'+label+'</span><span style="font-size:12px;color:var(--ink);font-weight:600;">'+value+'</span>';
    return r;
  }

  /* ---------------------------------------------------------------- */

  function renderProfile(){
    var p = state.profile;

  // Correo de destino de "Sugerencias" codificado en base64 — no aparece
  // como texto plano en el código ni se muestra en ningún lugar de la
  // interfaz; solo se decodifica en el momento de armar el enlace mailto.
  function suggestionRecipient(){
    return atob("aW5nZWxlY3ljb25mQGdtYWlsLmNvbQ==");
  }
  // Arma un enlace mailto: con el destinatario, asunto y cuerpo ya
  // completos y lo abre — así el mensaje "se deriva" directo al correo del
  // equipo: la persona solo tiene que confirmar el envío en su propia app
  // de correo (no hay backend en esta demo para enviarlo de forma 100%
  // silenciosa sin que el usuario intervenga).
  function openSuggestionMail(subject, body){
    var href = "mailto:" + suggestionRecipient() +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body);
    var a = document.createElement("a");
    a.href = href;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  var MOTIVATION_COUNT = 6;
  // Hash simple y estable de la fecha (YYYY-MM-DD) a un indice — asi el
  // mensaje del dia es siempre el mismo para todos si abren la app varias
  // veces, pero cambia de un dia a otro.
  function motivationIndexForDate(dateStr){
    var h = 0;
    for(var i=0;i<dateStr.length;i++){ h = (h*31 + dateStr.charCodeAt(i)) >>> 0; }
    return h % MOTIVATION_COUNT;
  }
  function showMotivationModal(){
    var idx = motivationIndexForDate(todayStr());
    showModal(t("motivation.title"), t("motivation.msg."+idx), t("motivation.cta"), null);
  }
  // Se llama al abrir la app (y justo despues de terminar el onboarding):
  // si hoy todavia no se mostro el mensaje motivacional, se muestra una
  // sola vez y se marca el dia como ya visto.
  function checkDailyMotivation(){
    if(!state.onboarded) return;
    if(membershipStatus().status === "expired") return; // bloqueado en el paywall, no corresponde animarlo a entrenar
    var today = todayStr();
    if(state.lastMotivationDate === today) return;
    state.lastMotivationDate = today;
    saveState();
    showMotivationModal();
  }

  document.addEventListener("click", function(e){
    var actionEl = e.target.closest("[data-action]");
    if(!actionEl) return;
    var action = actionEl.dataset.action;
    var arg = actionEl.dataset.arg;

    if(action === "nav"){ state.screen = arg; saveState(); render(); return; }
    if(action === "closemodal"){ closeModal(); return; }

    if(action === "ob-next"){
      var wrap = actionEl.closest(".ob-wrap");
      collectOnboardingInputs(wrap);
      state.obStep = Math.min(6, state.obStep+1);
      saveState(); render(); return;
    }
    if(action === "ob-health-continue"){
      // Si no autorizó datos de salud, no se piden ni se guardan
      // condiciones — se salta directo a la casilla de Términos.
      if(state.obHealthConsent){ state.obStep = 5; }
      else { state.profile.conditions = []; state.obStep = 6; }
      saveState(); render(); return;
    }
    if(action === "ob-legal-back"){
      state.obStep = state.obHealthConsent ? 5 : 4;
      saveState(); render(); return;
    }
    if(action === "toggleob"){
      state[arg] = !state[arg];
      saveState(); render(); return;
    }
    if(action === "viewlegaldoc"){
      showLegalDocModal(arg); return;
    }
    if(action === "condpick"){
      var conds = (state.profile.conditions || []).slice();
      var idx = conds.indexOf(arg);
      if(idx === -1) conds.push(arg); else conds.splice(idx, 1);
      state.profile.conditions = conds;
      saveState(); render(); return;
    }
    if(action === "ob-back"){
      var wrap2 = actionEl.closest(".ob-wrap");
      collectOnboardingInputs(wrap2);
      state.obStep = Math.max(0, state.obStep-1);
      saveState(); render(); return;
    }
    if(action === "picklang"){
      state.language = arg;
      saveState(); render(); return;
    }
    if(action === "setweightunit"){
      // Colecta lo que haya escrito en un campo de peso visible ANTES de
      // cambiar la unidad -- si no, al redibujar con la unidad nueva se
      // perdería lo que se acababa de tipear.
      var wUnitWrap = actionEl.closest(".ob-wrap");
      if(wUnitWrap) collectOnboardingInputs(wUnitWrap);
      state.weightUnit = arg;
      saveState(); render(); return;
    }
    if(action === "ob-finish"){
      if(!state.obTermsChecked || !state.obPrivacyChecked) return; // defensivo — el botón ya viene deshabilitado
      var wrap3 = actionEl.closest(".ob-wrap");
      collectOnboardingInputs(wrap3);
      recordConsent([
        { type:"terms", accepted: state.obTermsChecked },
        { type:"privacy", accepted: state.obPrivacyChecked },
        { type:"health", accepted: state.obHealthConsent },
        { type:"marketing", accepted: state.obMarketingChecked }
      ]);
      state.onboarded = true;
      state.screen = "home";
      // Solo se otorga prueba gratis si nunca se ha usado una en este
      // dispositivo — si ya se gastó (trialUsed) y sigue sin suscribirse,
      // se queda sin trialStart y render() lo manda a renderPaywall().
      if(!state.trialStart && !state.trialUsed) state.trialStart = new Date().toISOString();
      if(state.weightLog.length===0){
        state.weightLog.push({date: todayStr(), weight: state.profile.weight});
      }
      saveState(); render(); scheduleReminders(); checkDailyMotivation(); return;
    }

    if(actionEl.closest("[data-seg]")){
      var segName = actionEl.closest("[data-seg]").dataset.seg;
      var val = actionEl.dataset.val;
      Array.prototype.forEach.call(actionEl.parentElement.children, function(c){ c.classList.remove("active"); });
      actionEl.classList.add("active");
      state.profile[segName] = isNaN(Number(val)) ? val : val;
      if(segName === "goal" || segName === "location"){ saveState(); render(); }
      return;
    }

    if(action === "quickadd"){
      // Usa el ítem YA calculado de tu plan (mismas kcal que ves en la
      // pestaña Comidas) — antes tomaba un alimento al azar sin escalar a
      // tu meta, lo que causaba que la suma del día no cerrara.
      var tQ = targets(state.profile);
      var planQ = buildMealPlan(tQ.kcal, state.mealSeed);
      var pick = planQ.items.filter(function(it){ return it.type === arg; })[0];
      var d = todayStr();
      if(!state.logs[d]) state.logs[d] = [];
      var nameQ = pick.portionText ? (trName(pick.n)+" ("+pick.portionText+")") : trName(pick.n);
      state.logs[d].push({n: nameQ, kcal: pick.kcal, p: pick.p, c: pick.c, f: pick.f, type: arg});
      saveState(); render(); return;
    }
    if(action === "addalcohol"){
      var drink = ALCOHOL_DRINKS.filter(function(d){ return d.key === arg; })[0];
      if(drink){
        // Aviso de conciencia antes de registrar — no se guarda nada hasta
        // que la persona confirme, para que el gesto de marcar el trago
        // pase primero por una pausa informada.
        showModal(
          t("alcohol.warnTitle"),
          t("alcohol.warnText", { name:t(drink.key), kcal:drink.kcal }),
          t("alcohol.warnConfirm"),
          function(){
            var dAlc = todayStr();
            if(!state.logs[dAlc]) state.logs[dAlc] = [];
            state.logs[dAlc].push({ n:t(drink.key), kcal:drink.kcal, p:0, c:0, f:0, type:"alcohol" });
            saveState(); render();
          }
        );
      }
      return;
    }
    if(action === "addcustomfood"){
      var nameEl = document.getElementById("foodNameInput");
      var kcalEl = document.getElementById("foodKcalInput");
      var errEl = document.getElementById("foodFormError");
      var name = nameEl.value.trim();
      var kcalVal = parseFloat(kcalEl.value);
      if(!name || !kcalVal || kcalVal <= 0){
        errEl.textContent = t("home.formError");
        return;
      }
      var pVal = parseFloat(document.getElementById("foodProteinInput").value) || 0;
      var cVal = parseFloat(document.getElementById("foodCarbInput").value) || 0;
      var fVal = parseFloat(document.getElementById("foodFatInput").value) || 0;
      var mealTypeVal = (document.getElementById("manualFoodFields") || {}).dataset;
      mealTypeVal = mealTypeVal ? mealTypeVal.mealType : null;
      var d6 = todayStr();
      if(!state.logs[d6]) state.logs[d6] = [];
      state.logs[d6].push({ n:name, kcal:Math.round(kcalVal), p:Math.round(pVal), c:Math.round(cVal), f:Math.round(fVal), type:mealTypeVal });
      saveState(); render(); return;
    }
    if(action === "takefoodphoto"){
      var photoInput = document.getElementById("foodPhotoInput");
      if(photoInput) photoInput.click();
      return;
    }
    if(action === "togglemanualfood"){
      var mfWrap = document.getElementById("manualFoodFields");
      var mfBtn = document.getElementById("toggleManualBtn");
      if(mfWrap){
        mfWrap.hidden = !mfWrap.hidden;
        if(mfBtn) mfBtn.textContent = mfWrap.hidden ? t("home.enterManually") : t("home.hideManual");
      }
      return;
    }
    if(action === "togglealcoholpanel"){
      var alcWrap = document.getElementById("alcoholPanel");
      var alcBtn = document.getElementById("toggleAlcoholBtn");
      if(alcWrap){
        alcWrap.hidden = !alcWrap.hidden;
        if(alcBtn) alcBtn.textContent = alcWrap.hidden ? t("home.alcoholToggle") : t("home.hideAlcohol");
      }
      return;
    }
    if(action === "viewhistory"){ state.screen = "history"; saveState(); render(); return; }
    if(action === "backhistory"){ state.screen = "progress"; saveState(); render(); return; }
    if(action === "togglehistoryday"){
      var dayHead = actionEl;
      var dayBody = dayHead.nextElementSibling;
      var chevron = dayHead.querySelector(".muscle-chevron");
      if(dayBody){
        dayBody.hidden = !dayBody.hidden;
        if(chevron) chevron.classList.toggle("open", !dayBody.hidden);
      }
      return;
    }
    if(action === "togglesupp"){
      var dSup = todayStr();
      var daySupp = Object.assign({}, state.supplements[dSup]||{});
      daySupp[arg] = !daySupp[arg];
      state.supplements[dSup] = daySupp;
      saveState(); render(); return;
    }
    if(action === "pickmealtype"){
      var mtWrap = document.getElementById("manualFoodFields");
      var mtSeg = document.getElementById("mealTypeSeg");
      if(mtWrap) mtWrap.dataset.mealType = arg;
      if(mtSeg){
        Array.prototype.forEach.call(mtSeg.children, function(b){ b.classList.toggle("active", b.dataset.arg === arg); });
      }
      return;
    }
    if(action === "sendsuggestion"){
      var sugEl = document.getElementById("suggestionInput");
      var sugErrEl = document.getElementById("suggestionError");
      var sugText = sugEl.value.trim();
      if(!sugText){
        sugErrEl.textContent = t("profile.suggestionsEmpty");
        return;
      }
      sugErrEl.textContent = "";
      var p9 = state.profile;
      var bodyLines = [
        sugText,
        "",
        "— Enviado desde KalibraFit —",
        "Usuario: " + (p9.name || "(sin nombre)"),
        "Idioma: " + (state.language || "es")
      ];
      openSuggestionMail(t("profile.suggestionsSubject"), bodyLines.join("\n"));
      sugEl.value = "";
      showModal(t("profile.suggestions"), t("profile.suggestionsSent"), t("modal.ok"), null);
      return;
    }
    if(action === "removefood"){
      var d2 = todayStr();
      state.logs[d2].splice(Number(arg), 1);
      saveState(); render(); return;
    }
    if(action === "addmeal"){
      var tAdd = targets(state.profile);
      var planAdd = buildMealPlan(tAdd.kcal, state.mealSeed);
      var item = planAdd.items.filter(function(it){ return it.type === arg; })[0];
      var d3 = todayStr();
      if(!state.logs[d3]) state.logs[d3] = [];
      var nameAdd = item.portionText ? (trName(item.n)+" ("+item.portionText+")") : trName(item.n);
      state.logs[d3].push({n: nameAdd, kcal: item.kcal, p: item.p, c: item.c, f: item.f, type: arg});
      saveState(); render(); return;
    }
    if(action === "remixmeals"){ state.mealSeed++; saveState(); render(); return; }
    if(action === "remixworkouts"){ state.workoutSeed++; saveState(); render(); return; }

    if(action === "water+"){ state.water[todayStr()] = Math.min(20, todayWater()+1); saveState(); render(); return; }
    if(action === "water-"){ state.water[todayStr()] = Math.max(0, todayWater()-1); saveState(); render(); return; }

    if(action === "setloc"){ state.workoutDayFilter = arg; saveState(); render(); return; }
    if(action === "togglemuscle"){ state.musclePickerOpen = !state.musclePickerOpen; saveState(); render(); return; }
    if(action === "pickmuscle"){ state.selectedMuscle = (state.selectedMuscle === arg) ? null : arg; saveState(); render(); return; }
    if(action === "togglereminder"){
      var turningOn = !state.mealReminders[arg];
      state.mealReminders[arg] = turningOn;
      saveState();
      if(turningOn) requestNotifPermission();
      scheduleReminders();
      render();
      return;
    }
    if(action === "dismissreminder"){
      var dToday = todayStr();
      if(!state.dismissedReminders[dToday]) state.dismissedReminders[dToday] = {};
      state.dismissedReminders[dToday][arg] = true;
      saveState(); render(); return;
    }
    if(action === "toggledone"){
      var d4 = todayStr();
      if(!state.completion[d4]) state.completion[d4] = {};
      state.completion[d4][arg] = !state.completion[d4][arg];
      saveState(); render(); return;
    }
    if(action === "showex"){
      showExerciseModal(decodeURIComponent(arg));
      return;
    }
    if(action === "starttimer"){ startRestTimer(Number(arg)); return; }
    if(action === "pausetimer"){ pauseResumeRestTimer(); return; }
    if(action === "resettimer"){ resetRestTimer(); return; }

    if(action === "logweight"){
      var input = document.getElementById("weightInput");
      var vRaw = parseFloat(input.value);
      if(!vRaw || vRaw<=0) return;
      var v = unitToKg(vRaw, state.weightUnit); // lo tipeado está en la unidad elegida -- se guarda siempre en kg
      var d5 = todayStr();
      var existingIdx = state.weightLog.findIndex(function(w){ return w.date===d5; });
      if(existingIdx>=0) state.weightLog[existingIdx].weight = v;
      else state.weightLog.push({date:d5, weight:v});
      state.profile.weight = v;
      saveState(); render(); return;
    }

    if(action === "editprofile"){
      state.onboarded = false; state.obStep = 1; saveState(); render(); return;
    }

    if(action === "subscribe"){
      showModal(t("modal.subscribeTitle"), t("modal.subscribeText"), t("modal.activateDemo"), function(){
        state.subscribed = true; saveState(); render();
      });
      return;
    }
    if(action === "cancelmembership"){
      // Demo: en la app publicada esto abre la administración de
      // suscripciones nativa (App Store / Google Play) en vez de solo
      // apagar el flag local.
      showModal(t("profile.cancelMembershipConfirmTitle"), t("profile.cancelMembershipConfirmText"), t("profile.cancelMembership"), function(){
        state.subscribed = false; saveState(); render();
      });
      return;
    }
    if(action === "deleteaccount"){
      showModal(t("profile.deleteAccountConfirmTitle"), t("profile.deleteAccountConfirmText"), t("profile.deleteAccountConfirmButton"), function(){
        deleteAccount();
      });
      return;
    }
    if(action === "simtrialwarn"){
      state.trialStart = new Date(Date.now() - (TRIAL_MS - 14*60*1000)).toISOString();
      saveState(); render(); scheduleReminders(); return;
    }
    if(action === "simtrialexpired"){
      state.trialStart = new Date(Date.now() - (TRIAL_MS + 60*1000)).toISOString();
      saveState(); render(); scheduleReminders(); return;
    }
    if(action === "dismisstrialbanner"){
      state.trialReminderDismissed = new Date().toISOString();
      saveState(); render(); return;
    }
    if(action === "simtrialreset"){
      state.trialStart = new Date().toISOString();
      state.trialUsed = false;
      saveState(); render(); scheduleReminders(); return;
    }
  });

  document.addEventListener("change", function(e){
    if(e.target.id === "foodPhotoInput"){
      var file = e.target.files && e.target.files[0];
      handleFoodPhoto(file);
      e.target.value = ""; // permite elegir la misma foto otra vez si hace falta reintentar
      return;
    }
    var mealType = e.target.dataset.mealtime;
    if(mealType){
      state.mealTimes[mealType] = e.target.value;
      saveState();
      scheduleReminders();
      return;
    }
    var field = e.target.dataset.field;
    if(!field) return;
    state.profile[field] = clampFieldValue(e.target, field);
    saveState();
  });

  var NUMERIC_PROFILE_FIELDS = ["age","height","weight","goalWeight","days"];
  var WEIGHT_FIELDS = ["weight","goalWeight"];

  // Antes había DOS caminos separados escribiendo state.profile (este
  // listener de "change" y collectOnboardingInputs), y solo uno tenía un
  // resguardo -- pero como el listener de "change" corre PRIMERO (al
  // perder el foco, justo antes de tocar "Continuar") y no tenía
  // resguardo, dejaba guardado un 0 (ej. estatura) directo. Cuando
  // collectOnboardingInputs corría después e intentaba usar
  // "state.profile[field] || ..." como respaldo, ese respaldo YA estaba
  // corrompido por el primer camino -- terminaba guardando 0 igual. Ahora
  // los dos usan la misma función, que acota al rango real del campo
  // (min/max del input) en vez de solo intentar "no guardar si es falsy".
  function clampFieldValue(el, field){
    var v = el.value;
    if(field === "name") return v.trim();
    if(NUMERIC_PROFILE_FIELDS.indexOf(field) === -1) return v;
    var n = Number(v);
    if(v === "" || Number.isNaN(n)) return state.profile[field];
    // Para weight/goalWeight, lo que hay en el input y en min/max del HTML
    // está en la unidad elegida (kg o lb) -- se acota ahí y recién al final
    // se convierte a kg, que es como se guarda siempre por dentro.
    var isWeight = WEIGHT_FIELDS.indexOf(field) !== -1;
    var minAttr = el.min !== undefined && el.min !== "" ? Number(el.min) : null;
    var maxAttr = el.max !== undefined && el.max !== "" ? Number(el.max) : null;
    if(minAttr !== null && n < minAttr) n = minAttr;
    if(maxAttr !== null && n > maxAttr) n = maxAttr;
    if(n !== Number(v)) el.value = n; // refleja el ajuste en el campo, no solo en el estado
    return isWeight ? unitToKg(n, state.weightUnit) : n;
  }

  function collectOnboardingInputs(container){
    if(!container) return;
    Array.prototype.forEach.call(container.querySelectorAll("[data-field]"), function(inp){
      state.profile[inp.dataset.field] = clampFieldValue(inp, inp.dataset.field);
    });
  }

  /* ---------------------------------------------------------------- */
  /* INIT                                                               */
  /* ---------------------------------------------------------------- */

  render();
  scheduleReminders();
  checkDailyMotivation();
  // Refresca la pantalla cada minuto — así el banner de "es hora de..."
  // aparece y desaparece sin que el usuario tenga que tocar nada.
  setInterval(function(){ if(state.onboarded) render(); }, 60000);
})();
</script>
</body>
</html>
